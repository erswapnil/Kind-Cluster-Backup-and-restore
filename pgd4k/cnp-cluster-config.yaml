- apiVersion: v1
  data:
    queries: |
      # Query for getting PGD node state for each individual node
      #
      bdr_node_state:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            node_name,
            node_group_name,
            node_kind_name,
            peer_state_name as node_current_state,
            peer_target_state_name as node_target_state,
            (peer_state_name='ACTIVE')::integer as node_active,
            (peer_state_name='PARTED')::integer as node_parted,
            (peer_state_name in ('PART_START', 'PARTING', 'PART_CATCHUP', 'PART_CLEANUP'))::integer as node_parting,
            (peer_state_name in ('CATCHUP', 'JOINING'))::integer as node_joining
          FROM bdr.node_summary;
        metrics:
          - node_name:
              usage: "LABEL"
              description: "Name of the node"
          - node_group_name:
              usage: "LABEL"
              description: "Name of the group node resides in"
          - node_kind_name:
              usage: "LABEL"
              description: "Kind of the node, data or witness"
          - node_current_state:
              usage: "LABEL"
              description: "Current state of the node"
          - node_target_state:
              usage: "LABEL"
              description: "Target state of the node"
          - node_active:
              usage: "GAUGE"
              description: "1 if the node is active, 0 for not"
          - node_parted:
              usage: "GAUGE"
              description: "1 if the node is already parted, 0 for not"
          - node_parting:
              usage: "GAUGE"
              description: "1 if the node is in parting status, 0 for not"
          - node_joining:
              usage: "GAUGE"
              description: "1 if the node is in joining phase, 0 for not"

      # This series exposes changing info about PGD replication slots.
      #
      bdr_node_slots:
        predicate_query: |
           SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            slot_name,
            coalesce(active_pid, 0) as active_pid,
            coalesce(age(xmin), 0) as xmin_age,
            coalesce(age(catalog_xmin), 0) as catalog_xmin_age,
            coalesce(restart_lsn - pg_lsn '0/0', -1) AS restart_lsn,
            coalesce(confirmed_flush_lsn - pg_lsn '0/0', -1) AS confirmed_flush_lsn,
            coalesce(sent_lag_bytes, 0) as sent_lag_bytes,
            coalesce(write_lag_bytes, 0) as write_lag_bytes,
            coalesce(flush_lag_bytes, 0) as flush_lag_bytes,
            coalesce(replay_lag_bytes, 0) as replay_lag_bytes,
            extract(epoch from write_lag) as write_lag_seconds,
            extract(epoch from flush_lag) as flush_lag_seconds,
            extract(epoch from replay_lag) as replay_lag_seconds
          FROM bdr.node_slots
          WHERE
            slot_type = 'logical';
        metrics:
          - slot_name:
              usage: "LABEL"
              description: "Name of the replication slot. Constant over the life of the slot. Join key."
          - active_pid:
              usage: "GAUGE"
              description: "active_pid or 0 if no walsender active. See also cnp_bdr_node_slots_state_info{state}. Use active_pid!=0 for active."
          - xmin_age:
              usage: "GAUGE"
              description: "xmin age"
          - catalog_xmin_age:
              usage: "GAUGE"
              description: "catalog_xmin age"
          - restart_lsn:
              usage: "GAUGE"
              description: "restart_lsn as int64"
          - confirmed_flush_lsn:
              usage: "GAUGE"
              description: "confirmed_flush_lsn as int64"
          - sent_lag_bytes:
              usage: "GAUGE"
              description: "BDR sent lag bytes"
          - write_lag_bytes:
              usage: "GAUGE"
              description: "BDR write lag bytes"
          - flush_lag_bytes:
              usage: "GAUGE"
              description: "flush_lag in bytes"
          - replay_lag_bytes:
              usage: "GAUGE"
              description: "replay_lag in bytes"
          - write_lag_seconds:
              usage: "GAUGE"
              description: "BDR write lag in seconds based on commit timestamps. Inaccurate when idle."
          - flush_lag_seconds:
              usage: "GAUGE"
              description: "BDR flush lag in seconds based on commit timestamps. Inaccurate when idle."
          - replay_lag_seconds:
              usage: "GAUGE"
              description: "BDR replay lag in seconds based on commit timestamps. Inaccurate when idle."

      # Info-metric for PGD slots. It should be named bdr_node_slot_info but CNPG scraper limitations
      # prevent that. Intended for use when joining with cnp_bdr_node_slot_info
      # and the cnp_bdr_node_slots metrics.
      #
      bdr_node_slotmeta:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            slot_name,
            COALESCE (node_group_name, 'NULL') as node_group_name,
            origin_name,
            target_name AS peer_name,
            CASE
              WHEN is_group_slot THEN 'group'
              WHEN is_decoder_slot THEN 'decoder'
              WHEN slot_name LIKE 'bdr_world_%' THEN 'world'
              WHEN target_name <> '' THEN 'peer'
              ELSE 'unknown'
            END AS slot_usage,
            CASE
              WHEN temporary THEN 'temporary'
              ELSE 'persistent' END
            AS slot_persistence,
            1 AS info
          FROM bdr.node_slots
          WHERE
            slot_type = 'logical';
        metrics:
          - slot_name:
              usage: "LABEL"
              description: "Name of the replication slot. Constant over the life of the slot. Join key."
          - node_group_name:
              usage: "LABEL"
              description: "Nodegroup name for the originating nodegroup for the slot."
          - origin_name:
              usage: "LABEL"
              description: "Node name of the peer this slot tracks the data source for. This is usually the same as the local node, but in cascaded replication and catchup cases may not be."
          - peer_name:
              usage: "LABEL"
              description: "Node name of the peer this slot connects to (target_name)."
          - slot_usage:
              usage: "LABEL"
              description: "Slot usage - world, group, decoder, peer or unknown. A peer slot is a 'normal' slot."
          - slot_persistence:
              usage: "LABEL"
              description: "Slot persistence - 'temporary' or 'persistent'."
          - info:
              usage: "GAUGE"
              description: "Constant information about PGD replication slots, for joining with bdr_node_slots metrics and bdr_node_slot_info"

      bdr_node_slots_state:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            slot_name,
            state AS slot_state,
            1 AS info
          FROM bdr.node_slots
          WHERE
            slot_type = 'logical';
        metrics:
          - slot_name:
              usage: "LABEL"
              description: "Replication slot name. Join key."
          - slot_state:
              usage: "LABEL"
              description: "Slot state string. States from pg_catalog.pg_stat_replication.state or the string 'disconnected' if not connected."
          - info:
              usage: "GAUGE"
              description: "Always 1, the state is in the slot_state label. If you want a numeric form, use bdr_node_slots_active_pid!=0 instead."

      bdr_global_locking:
        # Global locking long waits, long holds
        # For each lock type, find the row with the oldest local_lock_request_time
        # then report one row per lock type with seconds since request
        # and if granted, seconds since grant.
        #
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            CASE lock_type
                when 'GLOBAL_LOCK_DML' then 'DML'
                when 'GLOBAL_LOCK_DDL' then 'DDL'
                when 'GLOBAL_LOCK_ADVISORY' then 'ADVISORY'
              end as lock_type,
            coalesce(extract(epoch from current_timestamp - local_request_time), -1) as since_locally_requested_s,
            coalesce(extract(epoch from current_timestamp - local_acquired_time), -1) as since_local_granted_s
          FROM (
            SELECT
              lock_type,
              local_lock_request_time,
              min(local_lock_request_time)
                over (partition by lock_type order by local_lock_request_time) as local_request_time,
              CASE WHEN acquire_stage = 'acquired' THEN
                min(last_state_change_time)
                  over (partition by lock_type order by local_lock_request_time)
              END AS local_acquired_time
            from bdr.global_locks
          ) oldest_for_each_lock_type
          group by lock_type, since_locally_requested_s, since_local_granted_s;
        metrics:
          - lock_type:
              usage: "LABEL"
              description: "lock_type"
          - since_locally_requested_s:
              usage: "GAUGE"
              description: "since_locally_requested_s"
          - since_local_granted_s:
              usage: "GAUGE"
              description: "since_local_granted_s"

      bdr_group_settings:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            node_group_name as group_name,
            node_group_type as group_type,
            coalesce(enable_wal_decoder, false)::integer as enable_wal_decoder,
            coalesce(enable_routing, false)::integer as enable_routing,
            coalesce(enable_raft, false)::integer as enable_raft
          FROM bdr.node_group_summary;
        metrics:
        - group_name:
            usage: "LABEL"
            description: "Name of PGD group this info relates to"
        - group_type:
            usage: "LABEL"
            description: "Type of PGD group this info relates to"
        - enable_wal_decoder:
            usage: "GAUGE"
            description: "1 enabled for this group, 0 disabled for this group"
        - enable_proxy_routing:
            usage: "GAUGE"
            description: "1 routing is enabled for this group, 0 disabled for this group"
        - enable_raft:
            usage: "GAUGE"
            description: "1 raft is enabled for this group, 0 disabled for this group"

      # This query returns the all the possible raft statuses and the value
      # column denotes which one of those is the current status. For example,
      # in the table below, the node is in RAFT_FOLLOWER for both node groups:
      #  node_group_name |  raft_status   | value
      # -----------------+----------------+-------
      #  world           | RAFT_FOLLOWER  |     1
      #  world           | RAFT_CANDIDATE |     0
      #  world           | RAFT_LEADER    |     0
      #  world           | RAFT_STOPPED   |     0
      #  p-pdnv85rj5g-a  | RAFT_FOLLOWER  |     1
      #  p-pdnv85rj5g-a  | RAFT_CANDIDATE |     0
      #  p-pdnv85rj5g-a  | RAFT_LEADER    |     0
      #  p-pdnv85rj5g-a  | RAFT_STOPPED   |     0
      #
      #  See also bdr_raft_summary, bdr_raft_leader
      #
      bdr_raft:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            srs.group_name,
            prs.raft_state AS raft_status,
            coalesce(srs.raft_state = prs.raft_state, false)::integer AS status
          FROM
            bdr.stat_raft_state srs
          CROSS JOIN (VALUES ('RAFT_FOLLOWER'), ('RAFT_CANDIDATE'), ('RAFT_LEADER'), ('RAFT_STOPPED')) prs(raft_state)
        metrics:
          - group_name:
              usage: "LABEL"
              description: "Name of the BDR node group"
          - raft_status:
              usage: "LABEL"
              description: "Returns the possible raft statuses"
          - status:
              usage: "GAUGE"
              description: "Returns 1 if the raft_status is the active status, otherwise it will return 0"

      # Expose current Raft leader name as a separate info-metric from bdr_raft_state
      # to manage series churn.
      #
      bdr_raft_leader:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            group_name,
            leader_name,
            1 as info
          FROM
            bdr.stat_raft_state;
        metrics:
          - group_name:
              usage: "LABEL"
              description: "Name of PGD group this info relates to"
          - leader_name:
              usage: "LABEL"
              description: "Which node is considered to be the current leader by the local node"
          - info:
              usage: "GAUGE"
              description: "Info-metric for current Raft leader name, see leader_name label"

      # Query for getting PGD Raft follower information.
      #
      # This only shows anything when run in Raft leader, and only when there is >1
      # node so follower nodes can exist.
      #
      # See also bdr_raft_summary, bdr_raft_leader
      #
      bdr_raft_follower_summary:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            group_name,
            node_name,
            sent_commit_index,
            match_index,
            coalesce(last_message_time,'1970-01-01 00:00:00+00'::timestamp with time zone) as last_message_time,
            coalesce(last_heartbeat_send_time,'1970-01-01 00:00:00+00'::timestamp with time zone) as last_heartbeat_send_time,
            coalesce(last_heartbeat_response_time,'1970-01-01 00:00:00+00'::timestamp with time zone) as last_heartbeat_response_time,
            coalesce(approx_clock_drift_ms,-1) AS approx_clock_drift_ms
          FROM
            bdr.stat_raft_followers_state;
        metrics:
        - group_name:
            usage: "LABEL"
            description: "Name of PGD group this info relates to"
        - node_name:
            usage: "LABEL"
            description: "Name of follower node this info relates to"
        - sent_commit_index:
            usage: "GAUGE"
            description: "Raft commit index sent to the node"
        - match_index:
            usage: "GAUGE"
            description: "Raft commit index confirmed by the node"
        - last_message_time:
            usage: "GAUGE"
            description: "Seen most recent message from a node"
        - last_heartbeat_send_time:
            usage: "GAUGE"
            description: "Last time leader sent heartbeat to a node"
        - last_heartbeat_response_time:
            usage: "GAUGE"
            description: "Last time node responded to heartbeat from leader"
        - approx_clock_drift_ms:
            usage: "GAUGE"
            description: "Approximate clock drift (in milliseconds) detected against the node, or -1 if unknown"

      # Summary of Raft state on current PGD node.
      #
      bdr_raft_summary:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            group_name,
            is_voting,
            heartbeat_timeout_ms,
            heartbeat_elapsed_ms,
            current_term,
            commit_index,
            apply_index,
            last_log_term,
            last_log_index,
            oldest_log_index,
            newest_prunable_log_index,
            snapshot_term,
            snapshot_index,
            nnodes,
            nvoting_nodes
          FROM
            bdr.stat_raft_state;
        metrics:
          - group_name:
              usage: "LABEL"
              description: "Name of PGD group this info relates to"
          - is_voting:
              usage: "GAUGE"
              description: "Is the local node a voting node (when false the local node is just a learner)"
          - heartbeat_timeout_ms:
              usage: "GAUGE"
              description: "What's the heartbeat election timeout in current Raft term on local node"
          - heartbeat_elapsed_ms:
              usage: "GAUGE"
              description: "How long since the local node received heartbeat from leader"
          - current_term:
              usage: "GAUGE"
              description: "Current Raft term on the local node"
          - commit_index:
              usage: "GAUGE"
              description: "Current Raft commit index on local node"
          - apply_index:
              usage: "GAUGE"
              description: "Last applied Raft index on local node"
          - last_log_term:
              usage: "GAUGE"
              description: "Last request term"
          - last_log_index:
              usage: "GAUGE"
              description: "Last request index"
          - oldest_log_index:
              usage: "GAUGE"
              description: "Oldest index in the Raft log"
          - newest_prunable_log_index:
              usage: "GAUGE"
              description: "Newest not needed index in the Raft log"
          - snapshot_term:
              usage: "GAUGE"
              description: "Raft term of the last snapshot made"
          - snapshot_index:
              usage: "GAUGE"
              description: "Raft index of the last snapshot made"
          - nnodes:
              usage: "GAUGE"
              description: "How many total nodes are in this Raft group"
          - nvoting_nodes:
              usage: "GAUGE"
              description: "How many voting nodes are in this Raft group"

      bdr_rep_lag:
        # Replication lag and rate (upstream view)
        #
        predicate_query: |
           SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT target_name AS peer_name,
            coalesce(extract(epoch from replay_lag), -1) as replay_lag_s,
            coalesce(replay_lag_bytes,0) as replay_lag_bytes,
            coalesce(apply_rate,0) as apply_rate,
            coalesce(extract(epoch from catchup_interval),-1) as catchup_interval_s
          FROM bdr.node_replication_rates;
        metrics:
          - peer_name:
              usage: "LABEL"
              description: "peer_name"
          - replay_lag_s:
              usage: "GAUGE"
              description: "replay_lag_s"
          - replay_lag_bytes:
              usage: "GAUGE"
              description: "replay_lag_bytes"
          - apply_rate:
              usage: "GAUGE"
              description: "apply_rate estimate. Can be inaccurate when big txns are in progress."
          - catchup_interval_s:
              usage: "GAUGE"
              description: "catchup_interval_s estimate. Can be inaccurate when big txns are in progress."

      # Replication slot statistics
      #
      bdr_rep_slot_stats:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT ns.target_name AS peer_name,
            ns.slot_name,
            rs.spill_txns, rs.spill_count, rs.spill_bytes,
            rs.stream_txns, rs.stream_count, rs.stream_bytes,
            rs.total_txns, rs.total_bytes
          FROM pg_catalog.pg_stat_replication_slots rs
          JOIN bdr.node_slots ns USING (slot_name);
        runonserver: ">=14.0.0"
        metrics:
          - peer_name:
              usage: "LABEL"
              description: "peer_name"
          - slot_name:
              usage: "LABEL"
              description: "slot_name"
          - spill_txns:
              usage: "COUNTER"
              description: "spill_txns"
          - spill_count:
              usage: "COUNTER"
              description: "spill_count"
          - spill_bytes:
              usage: "COUNTER"
              description: "spill_bytes"
          - stream_txns:
              usage: "COUNTER"
              description: "stream_txns"
          - stream_count:
              usage: "COUNTER"
              description: "stream_count"
          - stream_bytes:
              usage: "COUNTER"
              description: "stream_bytes"
          - total_txns:
              usage: "COUNTER"
              description: "total_txns"
          - total_bytes:
              usage: "COUNTER"
              description: "total_bytes"

      # Replication health and slot status
      # See also bdr_node_slots, pg_stat_replication, bdr_rep_slot_stats, pg_replication_slots
      #
      bdr_rep_status:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            rs.origin_node_name AS origin_name,
            rs.node_name AS peer_name,
            replication_blocked::integer,
            extract(epoch from uptime) as uptime_s
          FROM bdr.replication_status rs
        metrics:
          - origin_name:
              usage: "LABEL"
              description: "Originating node name, usually same as current node but may vary in cascading replication, catchup etc."
          - peer_name:
              usage: "LABEL"
              description: "peer_name"
          - replication_blocked:
              usage: "GAUGE"
              description: "replication_blocked"
          - uptime_s:
              usage: "GAUGE"
              description: "uptime_s"

      # information about receiver workers. Use in conjunction with bdr_worker_summary and bdr_receiver_info
      # joining by pid
      #
      bdr_receiver_summary:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            worker_pid AS pid,
            CASE worker_state
              WHEN 'running' THEN 1
              WHEN 'down' THEN 0
              ELSE -1
            END AS state_up,
            extract(epoch from sub_apply_delay) AS sub_apply_delay_s,
            COALESCE(pg_catalog.pg_wal_lsn_diff(receive_lsn,'0/0'::pg_lsn), 0) AS receive_lsn,
            COALESCE(pg_catalog.pg_wal_lsn_diff(receive_commit_lsn,'0/0'::pg_lsn), 0) AS receive_commit_lsn,
            COALESCE(pg_catalog.pg_wal_lsn_diff(xact_apply_lsn,'0/0'::pg_lsn), 0) AS last_xact_replay_lsn,
            COALESCE(pg_catalog.pg_wal_lsn_diff(xact_flush_lsn,'0/0'::pg_lsn), 0) AS last_xact_flush_lsn,
            xact_apply_timestamp AS last_xact_replay_timestamp
          FROM bdr.stat_receiver
        metrics:
          - pid:
              usage: "LABEL"
              description: "PID of the receiver, for joining on bdr_worker_summary, bdr_receiver_info etc"
          - state_up:
              usage: "GAUGE"
              description: "Worker state: 1 for running, 0 for down, -1 for unknown"
          - sub_apply_delay_s:
              usage: "GAUGE"
              description: "Delay for applying changes, in fractional seconds"
          - receive_lsn:
              usage: "GAUGE"
              description: "Last received LSN"
          - receive_commit_lsn:
              usage: "GAUGE"
              description: "Last received COMMIT LSN"
          - last_xact_replay_lsn:
              usage: "GAUGE"
              description: "Last reported replay LSN"
          - last_xact_flush_lsn:
              usage: "GAUGE"
              description: "Last reported flush LSN"
          - last_xact_replay_timestamp:
              usage: "GAUGE"
              description: "Last reported commit timestamp"

      # Info-metrics about BDR receivers for joining on bdr_receiver_summary metrics,
      # bdr_worker_summary etc. These are kept separate from bdr_receiver_summary metrics
      # to limit issues with label churn and total label width.
      bdr_receiver_info:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            worker_pid AS pid,
            sub_name,
            sub_slot_name,
            origin_name,
            source_name,
            subscription_mode,
            sub_replication_sets,
            1 as info
          FROM bdr.stat_receiver
        metrics:
          # pid is the identifying label for this info-metric
          - pid:
              usage: "LABEL"
              description: "PID of the receiver, for joining on bdr_worker_summary, bdr_receiver_summary series etc"
          # remaining labels are informational, for join purposes
          - sub_name:
              usage: "LABEL"
              description: "Subscription of the receiver"
          - sub_slot_name:
              usage: "LABEL"
              description: "Replication slot name used by the receiver"
          - origin_name:
              usage: "LABEL"
              description: "Name of origin node for replicated changes"
          - source_name:
              usage: "LABEL"
              description: "Name of the source node for replicated changes (usually same as above except for resynchronization)"
          - subscription_mode:
              usage: "LABEL"
              description: "Mode of the subscription (NORMAL, CATCHUP, FORWARD)"
          - sub_replication_sets:
              usage: "LABEL"
              description: "Replication sets subscribed"
          - info:
              usage: "GAUGE"
              description: "Receiver info metrics, by pid. See also bdr_receiver_summary, bdr_worker_summary"

      bdr_routing_candidate:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            node_group_name AS group_name,
            node_name,
            node_route_fence::integer AS node_route_fenced,
            node_route_reads::integer AS node_reads_enabled,
            node_route_writes::integer AS node_writes_enabled,
            node_route_priority,
            EXTRACT(EPOCH FROM last_message_time) AS last_message_time_epoch
          FROM bdr.stat_routing_candidate_state;
        metrics:
          - group_name:
              usage: "LABEL"
              description: "Name of PGD group this info relates to"
          - node_name:
              usage: "LABEL"
              description: "Name of the candidate node"
          - node_route_fenced:
              usage: "GAUGE"
              description: "1 if the node is fenced (can't be used for routing), 0 for normal operation"
          - node_reads_enabled:
              usage: "GAUGE"
              description: "1 if the node can be used for routing reads"
          - node_writes_enabled:
              usage: "GAUGE"
              description: "1 if the node can be used for routing writes"
          - node_route_priority:
              usage: "GAUGE"
              description: "Node priority when picking new leader (higher value means higher priority)"
          - last_message_time_epoch:
              usage: "GAUGE"
              description: "Last time the Raft leader has received any message from given node (epoch time)"

      # Info on PGD query routing.
      #
      # Sample query on the underlying view:
      #
      #    bdrdb=# select * from bdr.stat_routing_state;
      #    -[ RECORD 1 ]------------+-----------------------------------------------------
      #    node_group_name          | p-epbf9ucd3x-a
      #    write_lead_name          | p-epbf9ucd3x-a-3
      #    previous_write_lead_name | p-epbf9ucd3x-a-3
      #    read_names               | {p-epbf9ucd3x-a-1,p-epbf9ucd3x-a-2}
      #    write_candidate_names    | {p-epbf9ucd3x-a-1,p-epbf9ucd3x-a-3,p-epbf9ucd3x-a-2}
      #    read_candidate_names     | {p-epbf9ucd3x-a-1,p-epbf9ucd3x-a-3,p-epbf9ucd3x-a-2}
      #
      # This query will emit metrics like
      #
      #     bdr_routing_write_lead{group_name="p-epbf9ucd3x-a",node_name="p-epbf9ucd3x-a-1"} 0
      #     bdr_routing_write_lead{group_name="p-epbf9ucd3x-a",node_name="p-epbf9ucd3x-a-2"} 0
      #     bdr_routing_write_lead{group_name="p-epbf9ucd3x-a",node_name="p-epbf9ucd3x-a-2"} 1
      #
      # to indicate the leader and the candidates.
      #
      bdr_routing_write:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            node_group_name AS group_name,
            candidate_leader AS node_name,
            (write_lead_name = candidate_leader)::integer AS lead
          FROM bdr.stat_routing_state CROSS JOIN LATERAL unnest(write_candidate_names) AS candidate_leader;
        metrics:
          - group_name:
              usage: "LABEL"
              description: "Name of PGD group this info relates to"
          - node_name:
              usage: "LABEL"
              description: "Name of the PGD write leader candidate node"
          - lead:
              usage: "GAUGE"
              description: "1 if the node with this node_name label is the leader, 0 for leader-candidates that are not currently leaders"

      # Info and status metrics on PGD workers.
      #
      bdr_worker_summary:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            worker_role AS role_name,
            worker_pid AS pid,
            sub_name,
            worker_start,
            worker_xact_start AS xact_start,
            worker_query_start AS query_start,
            worker_backend_state_change AS backend_state_change,
            CASE worker_backend_state
              WHEN 'active' THEN 1
              WHEN 'idle' THEN 2
              WHEN 'idle in transaction' THEN 3
              WHEN 'idle in transaction (aborted)' THEN  4
              WHEN 'fastpath function call' THEN 5
              WHEN 'disabled' THEN -1
              ELSE -1
            END AS backend_state,
            coalesce( array_length(blocked_by_pids, 1), 0 ) AS n_blocker_pids,
            worker_xid AS local_xid,
            worker_xmin AS local_xmin
          FROM bdr.stat_worker;
        metrics:
          - role_name:
              usage: "LABEL"
              description: "Worker role"
          # It is necessary to have the pid as a label since (role_name, sub_name) are not
          # sufficient to ensure uniqueness of a worker entry.
          - pid:
              usage: "LABEL"
              description: "Worker PID, for joining on other metrics"
          - sub_name:
              usage: "LABEL"
              description: "Subscription of the worker (if any)"
          - worker_start:
              usage: "GAUGE"
              description: "Time when the worker has started"
          - xact_start:
              usage: "GAUGE"
              description: "Time when current transaction has started (if any)"
          - query_start:
              usage: "GAUGE"
              description: "Time of current query start (if any, usually NULL)"
          - backend_state_change:
              usage: "GAUGE"
              description: "Last time backend state has changed, see pg_stat_activity documentation"
          - backend_state:
              usage: "GAUGE"
              description: "Enumeration of backend state. active: 1, idle: 2, idle in tx: 3, idle in aborted tx: 4, fastpath call: 5, unknown or disabled tracking: -1"
          - n_blocker_pids:
              usage: "GAUGE"
              description: "Number of other processes being waited on (e.g. for locks). Zero indicates not blocked by other pids, but might still be blocked by LWLocks or non-pid waits like xid waits."
          - local_xid:
              usage: "GAUGE"
              description: "Current xid of the worker (if any)"
          - local_xmin:
              usage: "GAUGE"
              description: "Current xmin of the worker (if any)"

      # Extract wait-event details for PGD workers into their own separate info-metric series so
      # that the label churn this imposes on the other bdr_worker_summary metrics is mitigated.
      #
      bdr_worker_wait_event:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            worker_pid AS pid,
            wait_event_type,
            wait_event,
            1 AS info
          FROM bdr.stat_worker;
        metrics:
          - pid:
              usage: "LABEL"
              description: "Worker PID, for joining on other metrics"
          - wait_event_type:
              usage: "LABEL"
              description: "What type of event the worker is waiting for (if any), see pg_stat_activity documentation"
          - wait_event:
              usage: "LABEL"
              description: "What exact event the worker is waiting for (if any), see pg_stat_activity documentation"
          - info:
              usage: "GAUGE"
              description: "info-metric tracking current wait-events for PGD workers, for joining on bdr_worker_summary etc"

      # Extract backend state details for PGD workers into their own separate info-metric series so
      # that the label churn this imposes on the other bdr_worker_summary metrics is mitigated.
      #
      bdr_worker_state:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            worker_pid AS pid,
            worker_backend_state AS backend_state,
            1 AS info
          FROM bdr.stat_worker;
        metrics:
          - pid:
              usage: "LABEL"
              description: "Worker PID, for joining on other metrics"
          - backend_state:
              usage: "LABEL"
              description: "Current backend state for the worker, see pg_stat_activity documentation"
          - info:
              usage: "GAUGE"
              description: "info-metric tracking current worker state for PGD workers, for joining on bdr_worker_summary etc"

      # This metrics returns the all the possible PGD Write Leader nodes
      #
      bdr_write_lead:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            node_group_name,
            write_lead AS write_leader_name,
            1 AS info
          FROM bdr.node_group_routing_summary;
        metrics:
          - node_group_name:
              usage: "LABEL"
              description: "Name of the BDR node group"
          - write_leader_name:
              usage: "LABEL"
              description: "Write leader name of the BDR node group"
          - info:
              usage: "GAUGE"
              description: "Info metric with labels identifying PGD write leader"

      # Information about PGD writer processes.
      #
      bdr_writer_summary:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            sub_name,
            writer_nr,
            worker_pid AS pid,
            CASE worker_state
              WHEN 'running' THEN 1
              WHEN 'down' THEN 0
              ELSE -1
            END AS state_up,
            coalesce(xact_source_xid::text::bigint, BIGINT '0') AS remote_xid,
            coalesce(pg_catalog.pg_wal_lsn_diff(xact_source_commit_lsn, '0/0'::pg_lsn), 0) AS remote_commit_lsn,
            commit_queue_position,
            nxacts,
            ncommits,
            naborts,
            xact_nchanges,
            CASE WHEN streaming_allowed THEN 1 ELSE 0 END as streaming_allowed,
            CASE WHEN is_streaming THEN 1 ELSE 0 END AS is_streaming,
            nstream_file,
            nstream_writer,
            1 as info
          FROM bdr.stat_writer;
        metrics:
          # sub_name and writer_nr are the identifying labels for these series
          - sub_name:
              usage: "LABEL"
              description: "Subscription of the writer"
          - writer_nr:
              usage: "LABEL"
              description: "Index of the writer in the parallel apply group, stable over writer lifetime"
          # pid is needed as a label to allow for joining on bdr_worker_summary etc
          - pid:
              usage: "LABEL"
              description: "Process ID of this writer, for joining on bdr_worker_summary etc"
          - state_up:
              usage: "GAUGE"
              description: "Worker state: 1 for running, 0 for down, -1 for unknown"
          - remote_xid:
              usage: "GAUGE"
              description: "What's the origin's XID the worker is currently processing"
          - remote_commit_lsn:
              usage: "GAUGE"
              description: "What's the origin's commit LSN (if known) of transaction the worker is currently processing"
          - commit_queue_position:
              usage: "GAUGE"
              description: "What's the writer's position in the parallel apply commit queue"
          - nxacts:
              usage: "COUNTER"
              description: "Number of transactions processed by the writer since it started"
          - ncommits:
              usage: "COUNTER"
              description: "Number of commits done by the writer since it started"
          - naborts:
              usage: "COUNTER"
              description: "Number of aborts done by the writer since it started"
          - xact_nchanges:
              usage: "GAUGE"
              description: "How many changes in current transaction the writer has processed (updated every 1000 changes, useful when working with large data loads)"
          - streaming_allowed:
              usage: "GAUGE"
              description: "1 if this writer can be used for transaction streaming otherwise 0"
          - is_streaming:
              usage: "GAUGE"
              description: "1 if the writer is currently streaming a txn otherwise 0"
          - nstream_file:
              usage: "COUNTER"
              description: "How many temp files for streaming were processed by the writer since it started"
          - nstream_writer:
              usage: "COUNTER"
              description: "How many direct streaming transactions were processed by the writer since it started"
          - info:
              usage: "GAUGE"
              description: "info"

      # Information about progress of long running commands (index creation,
      # cluster command, etc) that writer might be running. Only returns anything
      # if there is supported command being run by the PGD writer.
      #
      bdr_writer_command_progress:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            worker_pid AS pid,
            command_progress_cmdtag AS command_tag,
            coalesce(command_progress_phase_nr, -1) AS phase_num,
            coalesce(command_progress_count, -1) AS phase_count,
            coalesce(command_progress_tuples_done, -1) AS phase_tuples_done,
            coalesce(command_progress_phase_tuples_total, -1) AS phase_tuples_total
          FROM bdr.stat_writer
          WHERE command_progress_cmdtag IS NOT NULL;
        metrics:
          # pid is needed as a label to allow for joining on bdr_worker_summary etc
          - pid:
              usage: "LABEL"
              description: "process ID of this writer, for joining on bdr_writer_summary, bdr_worker_summary etc"
          - command_tag:
              usage: "LABEL"
              description: "Command tag being executed by writer"
          # These gauges will churn whenever the command tag changes, but that's
          # somewhat desirable in this case because the metric series will only
          # make sense for that specific command tag's execution. The churn won't
          # be enough worse than a single _info series dedicated to the tag to
          # make it worth splitting these off into a separate series with an
          # auxiliary info-metric. It's a bit trickier to consume directly due to instant
          # vector staleness issues, but meh.
          - phase_num:
              usage: "GAUGE"
              description: "Number of the phase the current command is in (out of phase_count)"
          - phase_count:
              usage: "GAUGE"
              description: "Total number of phases the current command has"
          - phase_tuples_done:
              usage: "GAUGE"
              description: "Out of phase_tuples_total, how many are done"
          - phase_tuples_total:
              usage: "GAUGE"
              description: "How many rows the current command has to process (if any)"

      bdr_version:
        predicate_query: |
          SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\.')
        query: |
          SELECT
            bdr.bdr_version_num() AS num,
            bdr.bdr_version() AS semver;
        metrics:
          - num:
              usage: "GAUGE"
              description: "BDR version expressed as an integer"
          - semver:
              usage: "LABEL"
              description: "BDR version expressed as SEMVER"

      connections:
        query: |
          WITH maxconns AS (
            SELECT
              current_setting('max_connections')::integer AS max_connections,
              current_setting('superuser_reserved_connections')::integer AS superuser_reserved_connections,
              coalesce(current_setting('reserved_connections', true)::integer, 0) AS reserved_connections
          ),
          conns AS (
            SELECT sum(d.numbackends) as numbackends
            FROM pg_catalog.pg_stat_database d
          )
          SELECT
            m.max_connections AS max,
            m.max_connections - m.superuser_reserved_connections - m.reserved_connections AS max_unreserved,
            c.numbackends AS current,
            (c.numbackends / m.max_connections::float4) * 100 AS current_percent,
            (c.numbackends / (m.max_connections - m.superuser_reserved_connections - m.reserved_connections)::float4) * 100 AS current_unreserved_percent
          FROM conns AS c
          CROSS JOIN maxconns m
        metrics:
          - max:
              usage: "GAUGE"
              description: "max_connections setting including any superuser_reserved_connections reserved slots"
          # Once this is reached, only superuser or (on pg16) pg_use_reserved_connections member can connect
          - max_unreserved:
              usage: "GAUGE"
              description: "max connections available to normal users before any reserved connections margin"
          # connections_current
          - current:
              usage: "GAUGE"
              description: "total connections across all databases including superuser connections"
          # connections_current_percent
          # This is a convenience metric for current/max, relied upon by datadog. We could compute
          # it with recording rules in Prometheus, but that'd be more costly than generating it here,
          # and we can't (currently) compute it in the otel collector where it's really needed.
          - current_percent:
              usage: "GAUGE"
              description: "percent of max_connections used on this postgres instance"
          - current_unreserved_percent:
              usage: "GAUGE"
              description: "percent of max_connections used on this postgres instance before any reserved connections margin"

      clock_time:
        # This inspired from https://github.com/EnterpriseDB/pgd-cli/blob/v5.3.0/internal/pgd/cmd/show_clockskew.go
        # As the query is not directly related to BDR and could be applicable to all types of PG nodes
        # We can be compare the value of now with the
        # timestamp on the metric scrape. This returns the following
        #       now
        # -------------------
        # 1709788818.737367
        query: |
          SELECT EXTRACT(EPOCH FROM NOW()) AS now;
        metrics:
          - now:
              usage: "GAUGE"
              description: "The current time in seconds since epoch as reported by the database server"
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"queries":"# Query for getting PGD node state for each individual node\n#\nbdr_node_state:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      node_name,\n      node_group_name,\n      node_kind_name,\n      peer_state_name as node_current_state,\n      peer_target_state_name as node_target_state,\n      (peer_state_name='ACTIVE')::integer as node_active,\n      (peer_state_name='PARTED')::integer as node_parted,\n      (peer_state_name in ('PART_START', 'PARTING', 'PART_CATCHUP', 'PART_CLEANUP'))::integer as node_parting,\n      (peer_state_name in ('CATCHUP', 'JOINING'))::integer as node_joining\n    FROM bdr.node_summary;\n  metrics:\n    - node_name:\n        usage: \"LABEL\"\n        description: \"Name of the node\"\n    - node_group_name:\n        usage: \"LABEL\"\n        description: \"Name of the group node resides in\"\n    - node_kind_name:\n        usage: \"LABEL\"\n        description: \"Kind of the node, data or witness\"\n    - node_current_state:\n        usage: \"LABEL\"\n        description: \"Current state of the node\"\n    - node_target_state:\n        usage: \"LABEL\"\n        description: \"Target state of the node\"\n    - node_active:\n        usage: \"GAUGE\"\n        description: \"1 if the node is active, 0 for not\"\n    - node_parted:\n        usage: \"GAUGE\"\n        description: \"1 if the node is already parted, 0 for not\"\n    - node_parting:\n        usage: \"GAUGE\"\n        description: \"1 if the node is in parting status, 0 for not\"\n    - node_joining:\n        usage: \"GAUGE\"\n        description: \"1 if the node is in joining phase, 0 for not\"\n\n# This series exposes changing info about PGD replication slots.\n#\nbdr_node_slots:\n  predicate_query: |\n     SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      slot_name,\n      coalesce(active_pid, 0) as active_pid,\n      coalesce(age(xmin), 0) as xmin_age,\n      coalesce(age(catalog_xmin), 0) as catalog_xmin_age,\n      coalesce(restart_lsn - pg_lsn '0/0', -1) AS restart_lsn,\n      coalesce(confirmed_flush_lsn - pg_lsn '0/0', -1) AS confirmed_flush_lsn,\n      coalesce(sent_lag_bytes, 0) as sent_lag_bytes,\n      coalesce(write_lag_bytes, 0) as write_lag_bytes,\n      coalesce(flush_lag_bytes, 0) as flush_lag_bytes,\n      coalesce(replay_lag_bytes, 0) as replay_lag_bytes,\n      extract(epoch from write_lag) as write_lag_seconds,\n      extract(epoch from flush_lag) as flush_lag_seconds,\n      extract(epoch from replay_lag) as replay_lag_seconds\n    FROM bdr.node_slots\n    WHERE\n      slot_type = 'logical';\n  metrics:\n    - slot_name:\n        usage: \"LABEL\"\n        description: \"Name of the replication slot. Constant over the life of the slot. Join key.\"\n    - active_pid:\n        usage: \"GAUGE\"\n        description: \"active_pid or 0 if no walsender active. See also cnp_bdr_node_slots_state_info{state}. Use active_pid!=0 for active.\"\n    - xmin_age:\n        usage: \"GAUGE\"\n        description: \"xmin age\"\n    - catalog_xmin_age:\n        usage: \"GAUGE\"\n        description: \"catalog_xmin age\"\n    - restart_lsn:\n        usage: \"GAUGE\"\n        description: \"restart_lsn as int64\"\n    - confirmed_flush_lsn:\n        usage: \"GAUGE\"\n        description: \"confirmed_flush_lsn as int64\"\n    - sent_lag_bytes:\n        usage: \"GAUGE\"\n        description: \"BDR sent lag bytes\"\n    - write_lag_bytes:\n        usage: \"GAUGE\"\n        description: \"BDR write lag bytes\"\n    - flush_lag_bytes:\n        usage: \"GAUGE\"\n        description: \"flush_lag in bytes\"\n    - replay_lag_bytes:\n        usage: \"GAUGE\"\n        description: \"replay_lag in bytes\"\n    - write_lag_seconds:\n        usage: \"GAUGE\"\n        description: \"BDR write lag in seconds based on commit timestamps. Inaccurate when idle.\"\n    - flush_lag_seconds:\n        usage: \"GAUGE\"\n        description: \"BDR flush lag in seconds based on commit timestamps. Inaccurate when idle.\"\n    - replay_lag_seconds:\n        usage: \"GAUGE\"\n        description: \"BDR replay lag in seconds based on commit timestamps. Inaccurate when idle.\"\n\n# Info-metric for PGD slots. It should be named bdr_node_slot_info but CNPG scraper limitations\n# prevent that. Intended for use when joining with cnp_bdr_node_slot_info\n# and the cnp_bdr_node_slots metrics.\n#\nbdr_node_slotmeta:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      slot_name,\n      COALESCE (node_group_name, 'NULL') as node_group_name,\n      origin_name,\n      target_name AS peer_name,\n      CASE\n        WHEN is_group_slot THEN 'group'\n        WHEN is_decoder_slot THEN 'decoder'\n        WHEN slot_name LIKE 'bdr_world_%' THEN 'world'\n        WHEN target_name \u003c\u003e '' THEN 'peer'\n        ELSE 'unknown'\n      END AS slot_usage,\n      CASE\n        WHEN temporary THEN 'temporary'\n        ELSE 'persistent' END\n      AS slot_persistence,\n      1 AS info\n    FROM bdr.node_slots\n    WHERE\n      slot_type = 'logical';\n  metrics:\n    - slot_name:\n        usage: \"LABEL\"\n        description: \"Name of the replication slot. Constant over the life of the slot. Join key.\"\n    - node_group_name:\n        usage: \"LABEL\"\n        description: \"Nodegroup name for the originating nodegroup for the slot.\"\n    - origin_name:\n        usage: \"LABEL\"\n        description: \"Node name of the peer this slot tracks the data source for. This is usually the same as the local node, but in cascaded replication and catchup cases may not be.\"\n    - peer_name:\n        usage: \"LABEL\"\n        description: \"Node name of the peer this slot connects to (target_name).\"\n    - slot_usage:\n        usage: \"LABEL\"\n        description: \"Slot usage - world, group, decoder, peer or unknown. A peer slot is a 'normal' slot.\"\n    - slot_persistence:\n        usage: \"LABEL\"\n        description: \"Slot persistence - 'temporary' or 'persistent'.\"\n    - info:\n        usage: \"GAUGE\"\n        description: \"Constant information about PGD replication slots, for joining with bdr_node_slots metrics and bdr_node_slot_info\"\n\nbdr_node_slots_state:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      slot_name,\n      state AS slot_state,\n      1 AS info\n    FROM bdr.node_slots\n    WHERE\n      slot_type = 'logical';\n  metrics:\n    - slot_name:\n        usage: \"LABEL\"\n        description: \"Replication slot name. Join key.\"\n    - slot_state:\n        usage: \"LABEL\"\n        description: \"Slot state string. States from pg_catalog.pg_stat_replication.state or the string 'disconnected' if not connected.\"\n    - info:\n        usage: \"GAUGE\"\n        description: \"Always 1, the state is in the slot_state label. If you want a numeric form, use bdr_node_slots_active_pid!=0 instead.\"\n\nbdr_global_locking:\n  # Global locking long waits, long holds\n  # For each lock type, find the row with the oldest local_lock_request_time\n  # then report one row per lock type with seconds since request\n  # and if granted, seconds since grant.\n  #\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      CASE lock_type\n          when 'GLOBAL_LOCK_DML' then 'DML'\n          when 'GLOBAL_LOCK_DDL' then 'DDL'\n          when 'GLOBAL_LOCK_ADVISORY' then 'ADVISORY'\n        end as lock_type,\n      coalesce(extract(epoch from current_timestamp - local_request_time), -1) as since_locally_requested_s,\n      coalesce(extract(epoch from current_timestamp - local_acquired_time), -1) as since_local_granted_s\n    FROM (\n      SELECT\n        lock_type,\n        local_lock_request_time,\n        min(local_lock_request_time)\n          over (partition by lock_type order by local_lock_request_time) as local_request_time,\n        CASE WHEN acquire_stage = 'acquired' THEN\n          min(last_state_change_time)\n            over (partition by lock_type order by local_lock_request_time)\n        END AS local_acquired_time\n      from bdr.global_locks\n    ) oldest_for_each_lock_type\n    group by lock_type, since_locally_requested_s, since_local_granted_s;\n  metrics:\n    - lock_type:\n        usage: \"LABEL\"\n        description: \"lock_type\"\n    - since_locally_requested_s:\n        usage: \"GAUGE\"\n        description: \"since_locally_requested_s\"\n    - since_local_granted_s:\n        usage: \"GAUGE\"\n        description: \"since_local_granted_s\"\n\nbdr_group_settings:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      node_group_name as group_name,\n      node_group_type as group_type,\n      coalesce(enable_wal_decoder, false)::integer as enable_wal_decoder,\n      coalesce(enable_routing, false)::integer as enable_routing,\n      coalesce(enable_raft, false)::integer as enable_raft\n    FROM bdr.node_group_summary;\n  metrics:\n  - group_name:\n      usage: \"LABEL\"\n      description: \"Name of PGD group this info relates to\"\n  - group_type:\n      usage: \"LABEL\"\n      description: \"Type of PGD group this info relates to\"\n  - enable_wal_decoder:\n      usage: \"GAUGE\"\n      description: \"1 enabled for this group, 0 disabled for this group\"\n  - enable_proxy_routing:\n      usage: \"GAUGE\"\n      description: \"1 routing is enabled for this group, 0 disabled for this group\"\n  - enable_raft:\n      usage: \"GAUGE\"\n      description: \"1 raft is enabled for this group, 0 disabled for this group\"\n\n# This query returns the all the possible raft statuses and the value\n# column denotes which one of those is the current status. For example,\n# in the table below, the node is in RAFT_FOLLOWER for both node groups:\n#  node_group_name |  raft_status   | value\n# -----------------+----------------+-------\n#  world           | RAFT_FOLLOWER  |     1\n#  world           | RAFT_CANDIDATE |     0\n#  world           | RAFT_LEADER    |     0\n#  world           | RAFT_STOPPED   |     0\n#  p-pdnv85rj5g-a  | RAFT_FOLLOWER  |     1\n#  p-pdnv85rj5g-a  | RAFT_CANDIDATE |     0\n#  p-pdnv85rj5g-a  | RAFT_LEADER    |     0\n#  p-pdnv85rj5g-a  | RAFT_STOPPED   |     0\n#\n#  See also bdr_raft_summary, bdr_raft_leader\n#\nbdr_raft:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      srs.group_name,\n      prs.raft_state AS raft_status,\n      coalesce(srs.raft_state = prs.raft_state, false)::integer AS status\n    FROM\n      bdr.stat_raft_state srs\n    CROSS JOIN (VALUES ('RAFT_FOLLOWER'), ('RAFT_CANDIDATE'), ('RAFT_LEADER'), ('RAFT_STOPPED')) prs(raft_state)\n  metrics:\n    - group_name:\n        usage: \"LABEL\"\n        description: \"Name of the BDR node group\"\n    - raft_status:\n        usage: \"LABEL\"\n        description: \"Returns the possible raft statuses\"\n    - status:\n        usage: \"GAUGE\"\n        description: \"Returns 1 if the raft_status is the active status, otherwise it will return 0\"\n\n# Expose current Raft leader name as a separate info-metric from bdr_raft_state\n# to manage series churn.\n#\nbdr_raft_leader:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      group_name,\n      leader_name,\n      1 as info\n    FROM\n      bdr.stat_raft_state;\n  metrics:\n    - group_name:\n        usage: \"LABEL\"\n        description: \"Name of PGD group this info relates to\"\n    - leader_name:\n        usage: \"LABEL\"\n        description: \"Which node is considered to be the current leader by the local node\"\n    - info:\n        usage: \"GAUGE\"\n        description: \"Info-metric for current Raft leader name, see leader_name label\"\n\n# Query for getting PGD Raft follower information.\n#\n# This only shows anything when run in Raft leader, and only when there is \u003e1\n# node so follower nodes can exist.\n#\n# See also bdr_raft_summary, bdr_raft_leader\n#\nbdr_raft_follower_summary:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      group_name,\n      node_name,\n      sent_commit_index,\n      match_index,\n      coalesce(last_message_time,'1970-01-01 00:00:00+00'::timestamp with time zone) as last_message_time,\n      coalesce(last_heartbeat_send_time,'1970-01-01 00:00:00+00'::timestamp with time zone) as last_heartbeat_send_time,\n      coalesce(last_heartbeat_response_time,'1970-01-01 00:00:00+00'::timestamp with time zone) as last_heartbeat_response_time,\n      coalesce(approx_clock_drift_ms,-1) AS approx_clock_drift_ms\n    FROM\n      bdr.stat_raft_followers_state;\n  metrics:\n  - group_name:\n      usage: \"LABEL\"\n      description: \"Name of PGD group this info relates to\"\n  - node_name:\n      usage: \"LABEL\"\n      description: \"Name of follower node this info relates to\"\n  - sent_commit_index:\n      usage: \"GAUGE\"\n      description: \"Raft commit index sent to the node\"\n  - match_index:\n      usage: \"GAUGE\"\n      description: \"Raft commit index confirmed by the node\"\n  - last_message_time:\n      usage: \"GAUGE\"\n      description: \"Seen most recent message from a node\"\n  - last_heartbeat_send_time:\n      usage: \"GAUGE\"\n      description: \"Last time leader sent heartbeat to a node\"\n  - last_heartbeat_response_time:\n      usage: \"GAUGE\"\n      description: \"Last time node responded to heartbeat from leader\"\n  - approx_clock_drift_ms:\n      usage: \"GAUGE\"\n      description: \"Approximate clock drift (in milliseconds) detected against the node, or -1 if unknown\"\n\n# Summary of Raft state on current PGD node.\n#\nbdr_raft_summary:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      group_name,\n      is_voting,\n      heartbeat_timeout_ms,\n      heartbeat_elapsed_ms,\n      current_term,\n      commit_index,\n      apply_index,\n      last_log_term,\n      last_log_index,\n      oldest_log_index,\n      newest_prunable_log_index,\n      snapshot_term,\n      snapshot_index,\n      nnodes,\n      nvoting_nodes\n    FROM\n      bdr.stat_raft_state;\n  metrics:\n    - group_name:\n        usage: \"LABEL\"\n        description: \"Name of PGD group this info relates to\"\n    - is_voting:\n        usage: \"GAUGE\"\n        description: \"Is the local node a voting node (when false the local node is just a learner)\"\n    - heartbeat_timeout_ms:\n        usage: \"GAUGE\"\n        description: \"What's the heartbeat election timeout in current Raft term on local node\"\n    - heartbeat_elapsed_ms:\n        usage: \"GAUGE\"\n        description: \"How long since the local node received heartbeat from leader\"\n    - current_term:\n        usage: \"GAUGE\"\n        description: \"Current Raft term on the local node\"\n    - commit_index:\n        usage: \"GAUGE\"\n        description: \"Current Raft commit index on local node\"\n    - apply_index:\n        usage: \"GAUGE\"\n        description: \"Last applied Raft index on local node\"\n    - last_log_term:\n        usage: \"GAUGE\"\n        description: \"Last request term\"\n    - last_log_index:\n        usage: \"GAUGE\"\n        description: \"Last request index\"\n    - oldest_log_index:\n        usage: \"GAUGE\"\n        description: \"Oldest index in the Raft log\"\n    - newest_prunable_log_index:\n        usage: \"GAUGE\"\n        description: \"Newest not needed index in the Raft log\"\n    - snapshot_term:\n        usage: \"GAUGE\"\n        description: \"Raft term of the last snapshot made\"\n    - snapshot_index:\n        usage: \"GAUGE\"\n        description: \"Raft index of the last snapshot made\"\n    - nnodes:\n        usage: \"GAUGE\"\n        description: \"How many total nodes are in this Raft group\"\n    - nvoting_nodes:\n        usage: \"GAUGE\"\n        description: \"How many voting nodes are in this Raft group\"\n\nbdr_rep_lag:\n  # Replication lag and rate (upstream view)\n  #\n  predicate_query: |\n     SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT target_name AS peer_name,\n      coalesce(extract(epoch from replay_lag), -1) as replay_lag_s,\n      coalesce(replay_lag_bytes,0) as replay_lag_bytes,\n      coalesce(apply_rate,0) as apply_rate,\n      coalesce(extract(epoch from catchup_interval),-1) as catchup_interval_s\n    FROM bdr.node_replication_rates;\n  metrics:\n    - peer_name:\n        usage: \"LABEL\"\n        description: \"peer_name\"\n    - replay_lag_s:\n        usage: \"GAUGE\"\n        description: \"replay_lag_s\"\n    - replay_lag_bytes:\n        usage: \"GAUGE\"\n        description: \"replay_lag_bytes\"\n    - apply_rate:\n        usage: \"GAUGE\"\n        description: \"apply_rate estimate. Can be inaccurate when big txns are in progress.\"\n    - catchup_interval_s:\n        usage: \"GAUGE\"\n        description: \"catchup_interval_s estimate. Can be inaccurate when big txns are in progress.\"\n\n# Replication slot statistics\n#\nbdr_rep_slot_stats:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT ns.target_name AS peer_name,\n      ns.slot_name,\n      rs.spill_txns, rs.spill_count, rs.spill_bytes,\n      rs.stream_txns, rs.stream_count, rs.stream_bytes,\n      rs.total_txns, rs.total_bytes\n    FROM pg_catalog.pg_stat_replication_slots rs\n    JOIN bdr.node_slots ns USING (slot_name);\n  runonserver: \"\u003e=14.0.0\"\n  metrics:\n    - peer_name:\n        usage: \"LABEL\"\n        description: \"peer_name\"\n    - slot_name:\n        usage: \"LABEL\"\n        description: \"slot_name\"\n    - spill_txns:\n        usage: \"COUNTER\"\n        description: \"spill_txns\"\n    - spill_count:\n        usage: \"COUNTER\"\n        description: \"spill_count\"\n    - spill_bytes:\n        usage: \"COUNTER\"\n        description: \"spill_bytes\"\n    - stream_txns:\n        usage: \"COUNTER\"\n        description: \"stream_txns\"\n    - stream_count:\n        usage: \"COUNTER\"\n        description: \"stream_count\"\n    - stream_bytes:\n        usage: \"COUNTER\"\n        description: \"stream_bytes\"\n    - total_txns:\n        usage: \"COUNTER\"\n        description: \"total_txns\"\n    - total_bytes:\n        usage: \"COUNTER\"\n        description: \"total_bytes\"\n\n# Replication health and slot status\n# See also bdr_node_slots, pg_stat_replication, bdr_rep_slot_stats, pg_replication_slots\n#\nbdr_rep_status:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      rs.origin_node_name AS origin_name,\n      rs.node_name AS peer_name,\n      replication_blocked::integer,\n      extract(epoch from uptime) as uptime_s\n    FROM bdr.replication_status rs\n  metrics:\n    - origin_name:\n        usage: \"LABEL\"\n        description: \"Originating node name, usually same as current node but may vary in cascading replication, catchup etc.\"\n    - peer_name:\n        usage: \"LABEL\"\n        description: \"peer_name\"\n    - replication_blocked:\n        usage: \"GAUGE\"\n        description: \"replication_blocked\"\n    - uptime_s:\n        usage: \"GAUGE\"\n        description: \"uptime_s\"\n\n# information about receiver workers. Use in conjunction with bdr_worker_summary and bdr_receiver_info\n# joining by pid\n#\nbdr_receiver_summary:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      worker_pid AS pid,\n      CASE worker_state\n        WHEN 'running' THEN 1\n        WHEN 'down' THEN 0\n        ELSE -1\n      END AS state_up,\n      extract(epoch from sub_apply_delay) AS sub_apply_delay_s,\n      COALESCE(pg_catalog.pg_wal_lsn_diff(receive_lsn,'0/0'::pg_lsn), 0) AS receive_lsn,\n      COALESCE(pg_catalog.pg_wal_lsn_diff(receive_commit_lsn,'0/0'::pg_lsn), 0) AS receive_commit_lsn,\n      COALESCE(pg_catalog.pg_wal_lsn_diff(xact_apply_lsn,'0/0'::pg_lsn), 0) AS last_xact_replay_lsn,\n      COALESCE(pg_catalog.pg_wal_lsn_diff(xact_flush_lsn,'0/0'::pg_lsn), 0) AS last_xact_flush_lsn,\n      xact_apply_timestamp AS last_xact_replay_timestamp\n    FROM bdr.stat_receiver\n  metrics:\n    - pid:\n        usage: \"LABEL\"\n        description: \"PID of the receiver, for joining on bdr_worker_summary, bdr_receiver_info etc\"\n    - state_up:\n        usage: \"GAUGE\"\n        description: \"Worker state: 1 for running, 0 for down, -1 for unknown\"\n    - sub_apply_delay_s:\n        usage: \"GAUGE\"\n        description: \"Delay for applying changes, in fractional seconds\"\n    - receive_lsn:\n        usage: \"GAUGE\"\n        description: \"Last received LSN\"\n    - receive_commit_lsn:\n        usage: \"GAUGE\"\n        description: \"Last received COMMIT LSN\"\n    - last_xact_replay_lsn:\n        usage: \"GAUGE\"\n        description: \"Last reported replay LSN\"\n    - last_xact_flush_lsn:\n        usage: \"GAUGE\"\n        description: \"Last reported flush LSN\"\n    - last_xact_replay_timestamp:\n        usage: \"GAUGE\"\n        description: \"Last reported commit timestamp\"\n\n# Info-metrics about BDR receivers for joining on bdr_receiver_summary metrics,\n# bdr_worker_summary etc. These are kept separate from bdr_receiver_summary metrics\n# to limit issues with label churn and total label width.\nbdr_receiver_info:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      worker_pid AS pid,\n      sub_name,\n      sub_slot_name,\n      origin_name,\n      source_name,\n      subscription_mode,\n      sub_replication_sets,\n      1 as info\n    FROM bdr.stat_receiver\n  metrics:\n    # pid is the identifying label for this info-metric\n    - pid:\n        usage: \"LABEL\"\n        description: \"PID of the receiver, for joining on bdr_worker_summary, bdr_receiver_summary series etc\"\n    # remaining labels are informational, for join purposes\n    - sub_name:\n        usage: \"LABEL\"\n        description: \"Subscription of the receiver\"\n    - sub_slot_name:\n        usage: \"LABEL\"\n        description: \"Replication slot name used by the receiver\"\n    - origin_name:\n        usage: \"LABEL\"\n        description: \"Name of origin node for replicated changes\"\n    - source_name:\n        usage: \"LABEL\"\n        description: \"Name of the source node for replicated changes (usually same as above except for resynchronization)\"\n    - subscription_mode:\n        usage: \"LABEL\"\n        description: \"Mode of the subscription (NORMAL, CATCHUP, FORWARD)\"\n    - sub_replication_sets:\n        usage: \"LABEL\"\n        description: \"Replication sets subscribed\"\n    - info:\n        usage: \"GAUGE\"\n        description: \"Receiver info metrics, by pid. See also bdr_receiver_summary, bdr_worker_summary\"\n\nbdr_routing_candidate:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      node_group_name AS group_name,\n      node_name,\n      node_route_fence::integer AS node_route_fenced,\n      node_route_reads::integer AS node_reads_enabled,\n      node_route_writes::integer AS node_writes_enabled,\n      node_route_priority,\n      EXTRACT(EPOCH FROM last_message_time) AS last_message_time_epoch\n    FROM bdr.stat_routing_candidate_state;\n  metrics:\n    - group_name:\n        usage: \"LABEL\"\n        description: \"Name of PGD group this info relates to\"\n    - node_name:\n        usage: \"LABEL\"\n        description: \"Name of the candidate node\"\n    - node_route_fenced:\n        usage: \"GAUGE\"\n        description: \"1 if the node is fenced (can't be used for routing), 0 for normal operation\"\n    - node_reads_enabled:\n        usage: \"GAUGE\"\n        description: \"1 if the node can be used for routing reads\"\n    - node_writes_enabled:\n        usage: \"GAUGE\"\n        description: \"1 if the node can be used for routing writes\"\n    - node_route_priority:\n        usage: \"GAUGE\"\n        description: \"Node priority when picking new leader (higher value means higher priority)\"\n    - last_message_time_epoch:\n        usage: \"GAUGE\"\n        description: \"Last time the Raft leader has received any message from given node (epoch time)\"\n\n# Info on PGD query routing.\n#\n# Sample query on the underlying view:\n#\n#    bdrdb=# select * from bdr.stat_routing_state;\n#    -[ RECORD 1 ]------------+-----------------------------------------------------\n#    node_group_name          | p-epbf9ucd3x-a\n#    write_lead_name          | p-epbf9ucd3x-a-3\n#    previous_write_lead_name | p-epbf9ucd3x-a-3\n#    read_names               | {p-epbf9ucd3x-a-1,p-epbf9ucd3x-a-2}\n#    write_candidate_names    | {p-epbf9ucd3x-a-1,p-epbf9ucd3x-a-3,p-epbf9ucd3x-a-2}\n#    read_candidate_names     | {p-epbf9ucd3x-a-1,p-epbf9ucd3x-a-3,p-epbf9ucd3x-a-2}\n#\n# This query will emit metrics like\n#\n#     bdr_routing_write_lead{group_name=\"p-epbf9ucd3x-a\",node_name=\"p-epbf9ucd3x-a-1\"} 0\n#     bdr_routing_write_lead{group_name=\"p-epbf9ucd3x-a\",node_name=\"p-epbf9ucd3x-a-2\"} 0\n#     bdr_routing_write_lead{group_name=\"p-epbf9ucd3x-a\",node_name=\"p-epbf9ucd3x-a-2\"} 1\n#\n# to indicate the leader and the candidates.\n#\nbdr_routing_write:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      node_group_name AS group_name,\n      candidate_leader AS node_name,\n      (write_lead_name = candidate_leader)::integer AS lead\n    FROM bdr.stat_routing_state CROSS JOIN LATERAL unnest(write_candidate_names) AS candidate_leader;\n  metrics:\n    - group_name:\n        usage: \"LABEL\"\n        description: \"Name of PGD group this info relates to\"\n    - node_name:\n        usage: \"LABEL\"\n        description: \"Name of the PGD write leader candidate node\"\n    - lead:\n        usage: \"GAUGE\"\n        description: \"1 if the node with this node_name label is the leader, 0 for leader-candidates that are not currently leaders\"\n\n# Info and status metrics on PGD workers.\n#\nbdr_worker_summary:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      worker_role AS role_name,\n      worker_pid AS pid,\n      sub_name,\n      worker_start,\n      worker_xact_start AS xact_start,\n      worker_query_start AS query_start,\n      worker_backend_state_change AS backend_state_change,\n      CASE worker_backend_state\n        WHEN 'active' THEN 1\n        WHEN 'idle' THEN 2\n        WHEN 'idle in transaction' THEN 3\n        WHEN 'idle in transaction (aborted)' THEN  4\n        WHEN 'fastpath function call' THEN 5\n        WHEN 'disabled' THEN -1\n        ELSE -1\n      END AS backend_state,\n      coalesce( array_length(blocked_by_pids, 1), 0 ) AS n_blocker_pids,\n      worker_xid AS local_xid,\n      worker_xmin AS local_xmin\n    FROM bdr.stat_worker;\n  metrics:\n    - role_name:\n        usage: \"LABEL\"\n        description: \"Worker role\"\n    # It is necessary to have the pid as a label since (role_name, sub_name) are not\n    # sufficient to ensure uniqueness of a worker entry.\n    - pid:\n        usage: \"LABEL\"\n        description: \"Worker PID, for joining on other metrics\"\n    - sub_name:\n        usage: \"LABEL\"\n        description: \"Subscription of the worker (if any)\"\n    - worker_start:\n        usage: \"GAUGE\"\n        description: \"Time when the worker has started\"\n    - xact_start:\n        usage: \"GAUGE\"\n        description: \"Time when current transaction has started (if any)\"\n    - query_start:\n        usage: \"GAUGE\"\n        description: \"Time of current query start (if any, usually NULL)\"\n    - backend_state_change:\n        usage: \"GAUGE\"\n        description: \"Last time backend state has changed, see pg_stat_activity documentation\"\n    - backend_state:\n        usage: \"GAUGE\"\n        description: \"Enumeration of backend state. active: 1, idle: 2, idle in tx: 3, idle in aborted tx: 4, fastpath call: 5, unknown or disabled tracking: -1\"\n    - n_blocker_pids:\n        usage: \"GAUGE\"\n        description: \"Number of other processes being waited on (e.g. for locks). Zero indicates not blocked by other pids, but might still be blocked by LWLocks or non-pid waits like xid waits.\"\n    - local_xid:\n        usage: \"GAUGE\"\n        description: \"Current xid of the worker (if any)\"\n    - local_xmin:\n        usage: \"GAUGE\"\n        description: \"Current xmin of the worker (if any)\"\n\n# Extract wait-event details for PGD workers into their own separate info-metric series so\n# that the label churn this imposes on the other bdr_worker_summary metrics is mitigated.\n#\nbdr_worker_wait_event:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      worker_pid AS pid,\n      wait_event_type,\n      wait_event,\n      1 AS info\n    FROM bdr.stat_worker;\n  metrics:\n    - pid:\n        usage: \"LABEL\"\n        description: \"Worker PID, for joining on other metrics\"\n    - wait_event_type:\n        usage: \"LABEL\"\n        description: \"What type of event the worker is waiting for (if any), see pg_stat_activity documentation\"\n    - wait_event:\n        usage: \"LABEL\"\n        description: \"What exact event the worker is waiting for (if any), see pg_stat_activity documentation\"\n    - info:\n        usage: \"GAUGE\"\n        description: \"info-metric tracking current wait-events for PGD workers, for joining on bdr_worker_summary etc\"\n\n# Extract backend state details for PGD workers into their own separate info-metric series so\n# that the label churn this imposes on the other bdr_worker_summary metrics is mitigated.\n#\nbdr_worker_state:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      worker_pid AS pid,\n      worker_backend_state AS backend_state,\n      1 AS info\n    FROM bdr.stat_worker;\n  metrics:\n    - pid:\n        usage: \"LABEL\"\n        description: \"Worker PID, for joining on other metrics\"\n    - backend_state:\n        usage: \"LABEL\"\n        description: \"Current backend state for the worker, see pg_stat_activity documentation\"\n    - info:\n        usage: \"GAUGE\"\n        description: \"info-metric tracking current worker state for PGD workers, for joining on bdr_worker_summary etc\"\n\n# This metrics returns the all the possible PGD Write Leader nodes\n#\nbdr_write_lead:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      node_group_name,\n      write_lead AS write_leader_name,\n      1 AS info\n    FROM bdr.node_group_routing_summary;\n  metrics:\n    - node_group_name:\n        usage: \"LABEL\"\n        description: \"Name of the BDR node group\"\n    - write_leader_name:\n        usage: \"LABEL\"\n        description: \"Write leader name of the BDR node group\"\n    - info:\n        usage: \"GAUGE\"\n        description: \"Info metric with labels identifying PGD write leader\"\n\n# Information about PGD writer processes.\n#\nbdr_writer_summary:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      sub_name,\n      writer_nr,\n      worker_pid AS pid,\n      CASE worker_state\n        WHEN 'running' THEN 1\n        WHEN 'down' THEN 0\n        ELSE -1\n      END AS state_up,\n      coalesce(xact_source_xid::text::bigint, BIGINT '0') AS remote_xid,\n      coalesce(pg_catalog.pg_wal_lsn_diff(xact_source_commit_lsn, '0/0'::pg_lsn), 0) AS remote_commit_lsn,\n      commit_queue_position,\n      nxacts,\n      ncommits,\n      naborts,\n      xact_nchanges,\n      CASE WHEN streaming_allowed THEN 1 ELSE 0 END as streaming_allowed,\n      CASE WHEN is_streaming THEN 1 ELSE 0 END AS is_streaming,\n      nstream_file,\n      nstream_writer,\n      1 as info\n    FROM bdr.stat_writer;\n  metrics:\n    # sub_name and writer_nr are the identifying labels for these series\n    - sub_name:\n        usage: \"LABEL\"\n        description: \"Subscription of the writer\"\n    - writer_nr:\n        usage: \"LABEL\"\n        description: \"Index of the writer in the parallel apply group, stable over writer lifetime\"\n    # pid is needed as a label to allow for joining on bdr_worker_summary etc\n    - pid:\n        usage: \"LABEL\"\n        description: \"Process ID of this writer, for joining on bdr_worker_summary etc\"\n    - state_up:\n        usage: \"GAUGE\"\n        description: \"Worker state: 1 for running, 0 for down, -1 for unknown\"\n    - remote_xid:\n        usage: \"GAUGE\"\n        description: \"What's the origin's XID the worker is currently processing\"\n    - remote_commit_lsn:\n        usage: \"GAUGE\"\n        description: \"What's the origin's commit LSN (if known) of transaction the worker is currently processing\"\n    - commit_queue_position:\n        usage: \"GAUGE\"\n        description: \"What's the writer's position in the parallel apply commit queue\"\n    - nxacts:\n        usage: \"COUNTER\"\n        description: \"Number of transactions processed by the writer since it started\"\n    - ncommits:\n        usage: \"COUNTER\"\n        description: \"Number of commits done by the writer since it started\"\n    - naborts:\n        usage: \"COUNTER\"\n        description: \"Number of aborts done by the writer since it started\"\n    - xact_nchanges:\n        usage: \"GAUGE\"\n        description: \"How many changes in current transaction the writer has processed (updated every 1000 changes, useful when working with large data loads)\"\n    - streaming_allowed:\n        usage: \"GAUGE\"\n        description: \"1 if this writer can be used for transaction streaming otherwise 0\"\n    - is_streaming:\n        usage: \"GAUGE\"\n        description: \"1 if the writer is currently streaming a txn otherwise 0\"\n    - nstream_file:\n        usage: \"COUNTER\"\n        description: \"How many temp files for streaming were processed by the writer since it started\"\n    - nstream_writer:\n        usage: \"COUNTER\"\n        description: \"How many direct streaming transactions were processed by the writer since it started\"\n    - info:\n        usage: \"GAUGE\"\n        description: \"info\"\n\n# Information about progress of long running commands (index creation,\n# cluster command, etc) that writer might be running. Only returns anything\n# if there is supported command being run by the PGD writer.\n#\nbdr_writer_command_progress:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      worker_pid AS pid,\n      command_progress_cmdtag AS command_tag,\n      coalesce(command_progress_phase_nr, -1) AS phase_num,\n      coalesce(command_progress_count, -1) AS phase_count,\n      coalesce(command_progress_tuples_done, -1) AS phase_tuples_done,\n      coalesce(command_progress_phase_tuples_total, -1) AS phase_tuples_total\n    FROM bdr.stat_writer\n    WHERE command_progress_cmdtag IS NOT NULL;\n  metrics:\n    # pid is needed as a label to allow for joining on bdr_worker_summary etc\n    - pid:\n        usage: \"LABEL\"\n        description: \"process ID of this writer, for joining on bdr_writer_summary, bdr_worker_summary etc\"\n    - command_tag:\n        usage: \"LABEL\"\n        description: \"Command tag being executed by writer\"\n    # These gauges will churn whenever the command tag changes, but that's\n    # somewhat desirable in this case because the metric series will only\n    # make sense for that specific command tag's execution. The churn won't\n    # be enough worse than a single _info series dedicated to the tag to\n    # make it worth splitting these off into a separate series with an\n    # auxiliary info-metric. It's a bit trickier to consume directly due to instant\n    # vector staleness issues, but meh.\n    - phase_num:\n        usage: \"GAUGE\"\n        description: \"Number of the phase the current command is in (out of phase_count)\"\n    - phase_count:\n        usage: \"GAUGE\"\n        description: \"Total number of phases the current command has\"\n    - phase_tuples_done:\n        usage: \"GAUGE\"\n        description: \"Out of phase_tuples_total, how many are done\"\n    - phase_tuples_total:\n        usage: \"GAUGE\"\n        description: \"How many rows the current command has to process (if any)\"\n\nbdr_version:\n  predicate_query: |\n    SELECT EXISTS (SELECT 1 FROM pg_catalog.pg_extension WHERE extname='bdr' AND extversion ~ '^6\\.')\n  query: |\n    SELECT\n      bdr.bdr_version_num() AS num,\n      bdr.bdr_version() AS semver;\n  metrics:\n    - num:\n        usage: \"GAUGE\"\n        description: \"BDR version expressed as an integer\"\n    - semver:\n        usage: \"LABEL\"\n        description: \"BDR version expressed as SEMVER\"\n\nconnections:\n  query: |\n    WITH maxconns AS (\n      SELECT\n        current_setting('max_connections')::integer AS max_connections,\n        current_setting('superuser_reserved_connections')::integer AS superuser_reserved_connections,\n        coalesce(current_setting('reserved_connections', true)::integer, 0) AS reserved_connections\n    ),\n    conns AS (\n      SELECT sum(d.numbackends) as numbackends\n      FROM pg_catalog.pg_stat_database d\n    )\n    SELECT\n      m.max_connections AS max,\n      m.max_connections - m.superuser_reserved_connections - m.reserved_connections AS max_unreserved,\n      c.numbackends AS current,\n      (c.numbackends / m.max_connections::float4) * 100 AS current_percent,\n      (c.numbackends / (m.max_connections - m.superuser_reserved_connections - m.reserved_connections)::float4) * 100 AS current_unreserved_percent\n    FROM conns AS c\n    CROSS JOIN maxconns m\n  metrics:\n    - max:\n        usage: \"GAUGE\"\n        description: \"max_connections setting including any superuser_reserved_connections reserved slots\"\n    # Once this is reached, only superuser or (on pg16) pg_use_reserved_connections member can connect\n    - max_unreserved:\n        usage: \"GAUGE\"\n        description: \"max connections available to normal users before any reserved connections margin\"\n    # connections_current\n    - current:\n        usage: \"GAUGE\"\n        description: \"total connections across all databases including superuser connections\"\n    # connections_current_percent\n    # This is a convenience metric for current/max, relied upon by datadog. We could compute\n    # it with recording rules in Prometheus, but that'd be more costly than generating it here,\n    # and we can't (currently) compute it in the otel collector where it's really needed.\n    - current_percent:\n        usage: \"GAUGE\"\n        description: \"percent of max_connections used on this postgres instance\"\n    - current_unreserved_percent:\n        usage: \"GAUGE\"\n        description: \"percent of max_connections used on this postgres instance before any reserved connections margin\"\n\nclock_time:\n  # This inspired from https://github.com/EnterpriseDB/pgd-cli/blob/v5.3.0/internal/pgd/cmd/show_clockskew.go\n  # As the query is not directly related to BDR and could be applicable to all types of PG nodes\n  # We can be compare the value of now with the\n  # timestamp on the metric scrape. This returns the following\n  #       now\n  # -------------------\n  # 1709788818.737367\n  query: |\n    SELECT EXTRACT(EPOCH FROM NOW()) AS now;\n  metrics:\n    - now:\n        usage: \"GAUGE\"\n        description: \"The current time in seconds since epoch as reported by the database server\"\n"},"kind":"ConfigMap","metadata":{"annotations":{},"creationTimestamp":"2026-05-29T07:43:23Z","name":"pgd-operator-default-monitoring","namespace":"default","resourceVersion":"6322","uid":"06e292ba-2e1a-48d9-b386-e19647dcf9b4"}}
    creationTimestamp: "2026-06-01T10:54:25Z"
    name: pgd-operator-default-monitoring
    namespace: default
    resourceVersion: "1478"
    uid: cb53e7d1-5534-475e-a993-8ce16e9bd90d
- apiVersion: v1
  data:
    queries: |
      backends:
        query: |
         SELECT sa.datname
             , sa.usename
             , sa.application_name
             , states.state
             , COALESCE(sa.count, 0) AS total
             , COALESCE(sa.max_tx_secs, 0) AS max_tx_duration_seconds
             FROM ( VALUES ('active')
                 , ('idle')
                 , ('idle in transaction')
                 , ('idle in transaction (aborted)')
                 , ('fastpath function call')
                 , ('disabled')
                 ) AS states(state)
             LEFT JOIN (
                 SELECT datname
                     , state
                     , usename
                     , COALESCE(application_name, '') AS application_name
                     , pg_catalog.count(*)
                     , COALESCE(EXTRACT (EPOCH FROM (pg_catalog.max(pg_catalog.now() OPERATOR(pg_catalog.-) xact_start))), 0) AS max_tx_secs
                 FROM pg_catalog.pg_stat_activity
                 GROUP BY datname, state, usename, application_name
             ) sa ON states.state OPERATOR(pg_catalog.=) sa.state
             WHERE sa.usename IS NOT NULL
        metrics:
          - datname:
              usage: "LABEL"
              description: "Name of the database"
          - usename:
              usage: "LABEL"
              description: "Name of the user"
          - application_name:
              usage: "LABEL"
              description: "Name of the application"
          - state:
              usage: "LABEL"
              description: "State of the backend"
          - total:
              usage: "GAUGE"
              description: "Number of backends"
          - max_tx_duration_seconds:
              usage: "GAUGE"
              description: "Maximum duration of a transaction in seconds"

      backends_waiting:
        query: |
         SELECT pg_catalog.count(*) AS total
         FROM pg_catalog.pg_locks blocked_locks
         JOIN pg_catalog.pg_locks blocking_locks
           ON blocking_locks.locktype OPERATOR(pg_catalog.=) blocked_locks.locktype
           AND blocking_locks.database IS NOT DISTINCT FROM blocked_locks.database
           AND blocking_locks.relation IS NOT DISTINCT FROM blocked_locks.relation
           AND blocking_locks.page IS NOT DISTINCT FROM blocked_locks.page
           AND blocking_locks.tuple IS NOT DISTINCT FROM blocked_locks.tuple
           AND blocking_locks.virtualxid IS NOT DISTINCT FROM blocked_locks.virtualxid
           AND blocking_locks.transactionid IS NOT DISTINCT FROM blocked_locks.transactionid
           AND blocking_locks.classid IS NOT DISTINCT FROM blocked_locks.classid
           AND blocking_locks.objid IS NOT DISTINCT FROM blocked_locks.objid
           AND blocking_locks.objsubid IS NOT DISTINCT FROM blocked_locks.objsubid
           AND blocking_locks.pid OPERATOR(pg_catalog.<>) blocked_locks.pid
         JOIN pg_catalog.pg_stat_activity blocking_activity ON blocking_activity.pid OPERATOR(pg_catalog.=) blocking_locks.pid
         WHERE NOT blocked_locks.granted
        metrics:
          - total:
              usage: "GAUGE"
              description: "Total number of backends that are currently waiting on other queries"

      pg_database:
        query: |
          SELECT datname
            , pg_catalog.pg_database_size(datname) AS size_bytes
            , pg_catalog.age(datfrozenxid) AS xid_age
            , pg_catalog.mxid_age(datminmxid) AS mxid_age
          FROM pg_catalog.pg_database
          WHERE datallowconn
        metrics:
          - datname:
              usage: "LABEL"
              description: "Name of the database"
          - size_bytes:
              usage: "GAUGE"
              description: "Disk space used by the database"
          - xid_age:
              usage: "GAUGE"
              description: "Number of transactions from the frozen XID to the current one"
          - mxid_age:
              usage: "GAUGE"
              description: "Number of multiple transactions (Multixact) from the frozen XID to the current one"

      pg_postmaster:
        query: |
          SELECT EXTRACT(EPOCH FROM pg_postmaster_start_time) AS start_time
          FROM pg_catalog.pg_postmaster_start_time()
        metrics:
          - start_time:
              usage: "GAUGE"
              description: "Time at which postgres started (based on epoch)"

      pg_replication:
        query: "SELECT CASE WHEN (
                  NOT pg_catalog.pg_is_in_recovery()
                  OR pg_catalog.pg_last_wal_receive_lsn() OPERATOR(pg_catalog.=) pg_catalog.pg_last_wal_replay_lsn())
                THEN 0
                ELSE GREATEST (0,
                  EXTRACT(EPOCH FROM (pg_catalog.now() OPERATOR(pg_catalog.-) pg_catalog.pg_last_xact_replay_timestamp())))
                END AS lag,
                pg_catalog.pg_is_in_recovery() AS in_recovery,
                EXISTS (TABLE pg_catalog.pg_stat_wal_receiver) AS is_wal_receiver_up,
                (SELECT pg_catalog.count(*) FROM pg_catalog.pg_stat_replication) AS streaming_replicas"
        metrics:
          - lag:
              usage: "GAUGE"
              description: "Replication lag behind primary in seconds"
          - in_recovery:
              usage: "GAUGE"
              description: "Whether the instance is in recovery"
          - is_wal_receiver_up:
              usage: "GAUGE"
              description: "Whether the instance wal_receiver is up"
          - streaming_replicas:
              usage: "GAUGE"
              description: "Number of streaming replicas connected to the instance"

      pg_replication_slots:
        query: |
          SELECT slot_name,
            slot_type,
            database,
            active,
            (CASE pg_catalog.pg_is_in_recovery()
              WHEN TRUE THEN pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_last_wal_receive_lsn(), restart_lsn)
              ELSE pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), restart_lsn)
            END) as pg_wal_lsn_diff
          FROM pg_catalog.pg_replication_slots
          WHERE NOT temporary
        metrics:
          - slot_name:
              usage: "LABEL"
              description: "Name of the replication slot"
          - slot_type:
              usage: "LABEL"
              description: "Type of the replication slot"
          - database:
              usage: "LABEL"
              description: "Name of the database"
          - active:
              usage: "GAUGE"
              description: "Flag indicating whether the slot is active"
          - pg_wal_lsn_diff:
              usage: "GAUGE"
              description: "Replication lag in bytes"

      pg_stat_archiver:
        query: |
          SELECT archived_count
            , failed_count
            , COALESCE(EXTRACT(EPOCH FROM (pg_catalog.now() OPERATOR(pg_catalog.-) last_archived_time)), -1) AS seconds_since_last_archival
            , COALESCE(EXTRACT(EPOCH FROM (pg_catalog.now() OPERATOR(pg_catalog.-) last_failed_time)), -1) AS seconds_since_last_failure
            , COALESCE(EXTRACT(EPOCH FROM last_archived_time), -1) AS last_archived_time
            , COALESCE(EXTRACT(EPOCH FROM last_failed_time), -1) AS last_failed_time
            , COALESCE(CAST(CAST('x' OPERATOR(pg_catalog.||) pg_catalog.right(pg_catalog.split_part(last_archived_wal, '.', 1), 16) AS pg_catalog.bit(64)) AS pg_catalog.int8), -1) AS last_archived_wal_start_lsn
            , COALESCE(CAST(CAST('x' OPERATOR(pg_catalog.||) pg_catalog.right(pg_catalog.split_part(last_failed_wal, '.', 1), 16) AS pg_catalog.bit(64)) AS pg_catalog.int8), -1) AS last_failed_wal_start_lsn
            , EXTRACT(EPOCH FROM stats_reset) AS stats_reset_time
          FROM pg_catalog.pg_stat_archiver
        predicate_query: |
          SELECT NOT pg_catalog.pg_is_in_recovery()
            OR pg_catalog.current_setting('archive_mode') OPERATOR(pg_catalog.=) 'always'
        metrics:
          - archived_count:
              usage: "COUNTER"
              description: "Number of WAL files that have been successfully archived"
          - failed_count:
              usage: "COUNTER"
              description: "Number of failed attempts for archiving WAL files"
          - seconds_since_last_archival:
              usage: "GAUGE"
              description: "Seconds since the last successful archival operation"
          - seconds_since_last_failure:
              usage: "GAUGE"
              description: "Seconds since the last failed archival operation"
          - last_archived_time:
              usage: "GAUGE"
              description: "Epoch of the last time WAL archiving succeeded"
          - last_failed_time:
              usage: "GAUGE"
              description: "Epoch of the last time WAL archiving failed"
          - last_archived_wal_start_lsn:
              usage: "GAUGE"
              description: "Archived WAL start LSN"
          - last_failed_wal_start_lsn:
              usage: "GAUGE"
              description: "Last failed WAL LSN"
          - stats_reset_time:
              usage: "GAUGE"
              description: "Time at which these statistics were last reset"

      pg_stat_bgwriter:
        runonserver: "<17.0.0"
        query: |
          SELECT checkpoints_timed
            , checkpoints_req
            , checkpoint_write_time
            , checkpoint_sync_time
            , buffers_checkpoint
            , buffers_clean
            , maxwritten_clean
            , buffers_backend
            , buffers_backend_fsync
            , buffers_alloc
          FROM pg_catalog.pg_stat_bgwriter
        metrics:
          - checkpoints_timed:
              usage: "COUNTER"
              description: "Number of scheduled checkpoints that have been performed"
          - checkpoints_req:
              usage: "COUNTER"
              description: "Number of requested checkpoints that have been performed"
          - checkpoint_write_time:
              usage: "COUNTER"
              description: "Total amount of time that has been spent in the portion of checkpoint processing where files are written to disk, in milliseconds"
          - checkpoint_sync_time:
              usage: "COUNTER"
              description: "Total amount of time that has been spent in the portion of checkpoint processing where files are synchronized to disk, in milliseconds"
          - buffers_checkpoint:
              usage: "COUNTER"
              description: "Number of buffers written during checkpoints"
          - buffers_clean:
              usage: "COUNTER"
              description: "Number of buffers written by the background writer"
          - maxwritten_clean:
              usage: "COUNTER"
              description: "Number of times the background writer stopped a cleaning scan because it had written too many buffers"
          - buffers_backend:
              usage: "COUNTER"
              description: "Number of buffers written directly by a backend"
          - buffers_backend_fsync:
              usage: "COUNTER"
              description: "Number of times a backend had to execute its own fsync call (normally the background writer handles those even when the backend does its own write)"
          - buffers_alloc:
              usage: "COUNTER"
              description: "Number of buffers allocated"

      pg_stat_bgwriter_17:
        runonserver: ">=17.0.0"
        name: pg_stat_bgwriter
        query: |
          SELECT buffers_clean
            , maxwritten_clean
            , buffers_alloc
            , EXTRACT(EPOCH FROM stats_reset) AS stats_reset_time
          FROM pg_catalog.pg_stat_bgwriter
        metrics:
          - buffers_clean:
              usage: "COUNTER"
              description: "Number of buffers written by the background writer"
          - maxwritten_clean:
              usage: "COUNTER"
              description: "Number of times the background writer stopped a cleaning scan because it had written too many buffers"
          - buffers_alloc:
              usage: "COUNTER"
              description: "Number of buffers allocated"
          - stats_reset_time:
              usage: "GAUGE"
              description: "Time at which these statistics were last reset"

      pg_stat_checkpointer:
        runonserver: ">=17.0.0"
        query: |
          SELECT num_timed AS checkpoints_timed
            , num_requested AS checkpoints_req
            , restartpoints_timed
            , restartpoints_req
            , restartpoints_done
            , write_time
            , sync_time
            , buffers_written
            , EXTRACT(EPOCH FROM stats_reset) AS stats_reset_time
          FROM pg_catalog.pg_stat_checkpointer
        metrics:
          - checkpoints_timed:
              usage: "COUNTER"
              description: "Number of scheduled checkpoints that have been performed"
          - checkpoints_req:
              usage: "COUNTER"
              description: "Number of requested checkpoints that have been performed"
          - restartpoints_timed:
              usage: "COUNTER"
              description: "Number of scheduled restartpoints due to timeout or after a failed attempt to perform it"
          - restartpoints_req:
              usage: "COUNTER"
              description: "Number of requested restartpoints that have been performed"
          - restartpoints_done:
              usage: "COUNTER"
              description: "Number of restartpoints that have been performed"
          - write_time:
              usage: "COUNTER"
              description: "Total amount of time that has been spent in the portion of processing checkpoints and restartpoints where files are written to disk, in milliseconds"
          - sync_time:
              usage: "COUNTER"
              description: "Total amount of time that has been spent in the portion of processing checkpoints and restartpoints where files are synchronized to disk, in milliseconds"
          - buffers_written:
              usage: "COUNTER"
              description: "Number of buffers written during checkpoints and restartpoints"
          - stats_reset_time:
              usage: "GAUGE"
              description: "Time at which these statistics were last reset"

      pg_stat_database:
        query: |
          SELECT datname
            , xact_commit
            , xact_rollback
            , blks_read
            , blks_hit
            , tup_returned
            , tup_fetched
            , tup_inserted
            , tup_updated
            , tup_deleted
            , conflicts
            , temp_files
            , temp_bytes
            , deadlocks
            , blk_read_time
            , blk_write_time
          FROM pg_catalog.pg_stat_database
        metrics:
          - datname:
              usage: "LABEL"
              description: "Name of this database"
          - xact_commit:
              usage: "COUNTER"
              description: "Number of transactions in this database that have been committed"
          - xact_rollback:
              usage: "COUNTER"
              description: "Number of transactions in this database that have been rolled back"
          - blks_read:
              usage: "COUNTER"
              description: "Number of disk blocks read in this database"
          - blks_hit:
              usage: "COUNTER"
              description: "Number of times disk blocks were found already in the buffer cache, so that a read was not necessary (this only includes hits in the PostgreSQL buffer cache, not the operating system's file system cache)"
          - tup_returned:
              usage: "COUNTER"
              description: "Number of rows returned by queries in this database"
          - tup_fetched:
              usage: "COUNTER"
              description: "Number of rows fetched by queries in this database"
          - tup_inserted:
              usage: "COUNTER"
              description: "Number of rows inserted by queries in this database"
          - tup_updated:
              usage: "COUNTER"
              description: "Number of rows updated by queries in this database"
          - tup_deleted:
              usage: "COUNTER"
              description: "Number of rows deleted by queries in this database"
          - conflicts:
              usage: "COUNTER"
              description: "Number of queries canceled due to conflicts with recovery in this database"
          - temp_files:
              usage: "COUNTER"
              description: "Number of temporary files created by queries in this database"
          - temp_bytes:
              usage: "COUNTER"
              description: "Total amount of data written to temporary files by queries in this database"
          - deadlocks:
              usage: "COUNTER"
              description: "Number of deadlocks detected in this database"
          - blk_read_time:
              usage: "COUNTER"
              description: "Time spent reading data file blocks by backends in this database, in milliseconds"
          - blk_write_time:
              usage: "COUNTER"
              description: "Time spent writing data file blocks by backends in this database, in milliseconds"

      pg_stat_replication:
        primary: true
        query: |
         SELECT usename
           , COALESCE(application_name, '') AS application_name
           , COALESCE(client_addr::text, '') AS client_addr
           , COALESCE(client_port::text, '') AS client_port
           , EXTRACT(EPOCH FROM backend_start) AS backend_start
           , COALESCE(pg_catalog.age(backend_xmin), 0) AS backend_xmin_age
           , pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), sent_lsn) AS sent_diff_bytes
           , pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), write_lsn) AS write_diff_bytes
           , pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), flush_lsn) AS flush_diff_bytes
           , COALESCE(pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), replay_lsn),0) AS replay_diff_bytes
           , COALESCE((EXTRACT(EPOCH FROM write_lag)),0)::float AS write_lag_seconds
           , COALESCE((EXTRACT(EPOCH FROM flush_lag)),0)::float AS flush_lag_seconds
           , COALESCE((EXTRACT(EPOCH FROM replay_lag)),0)::float AS replay_lag_seconds
         FROM pg_catalog.pg_stat_replication
        metrics:
          - usename:
              usage: "LABEL"
              description: "Name of the replication user"
          - application_name:
              usage: "LABEL"
              description: "Name of the application"
          - client_addr:
              usage: "LABEL"
              description: "Client IP address"
          - client_port:
              usage: "LABEL"
              description: "Client TCP port"
          - backend_start:
              usage: "COUNTER"
              description: "Time when this process was started"
          - backend_xmin_age:
              usage: "COUNTER"
              description: "The age of this standby's xmin horizon"
          - sent_diff_bytes:
              usage: "GAUGE"
              description: "Difference in bytes from the last write-ahead log location sent on this connection"
          - write_diff_bytes:
              usage: "GAUGE"
              description: "Difference in bytes from the last write-ahead log location written to disk by this standby server"
          - flush_diff_bytes:
              usage: "GAUGE"
              description: "Difference in bytes from the last write-ahead log location flushed to disk by this standby server"
          - replay_diff_bytes:
              usage: "GAUGE"
              description: "Difference in bytes from the last write-ahead log location replayed into the database on this standby server"
          - write_lag_seconds:
              usage: "GAUGE"
              description: "Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written it"
          - flush_lag_seconds:
              usage: "GAUGE"
              description: "Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written and flushed it"
          - replay_lag_seconds:
              usage: "GAUGE"
              description: "Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written, flushed and applied it"

      pg_settings:
        query: |
          SELECT name,
          CASE setting WHEN 'on' THEN '1' WHEN 'off' THEN '0' ELSE setting END AS setting
          FROM pg_catalog.pg_settings
          WHERE vartype IN ('integer', 'real', 'bool')
          ORDER BY 1
        metrics:
          - name:
              usage: "LABEL"
              description: "Name of the setting"
          - setting:
              usage: "GAUGE"
              description: "Setting value"

      pg_extensions:
        query: |
          SELECT
           pg_catalog.current_database() as datname,
           name as extname,
           default_version,
           installed_version,
           CASE
             WHEN default_version OPERATOR(pg_catalog.=) installed_version THEN 0
             ELSE 1
          END AS update_available
          FROM pg_catalog.pg_available_extensions
          WHERE installed_version IS NOT NULL
        metrics:
          - datname:
              usage: "LABEL"
              description: "Name of the database"
          - extname:
              usage: "LABEL"
              description: "Extension name"
          - default_version:
              usage: "LABEL"
              description: "Default version"
          - installed_version:
              usage: "LABEL"
              description: "Installed version"
          - update_available:
