- apiVersion: v1
  data:
    queries: |
      backends:
        query: |
         SELECT sa.datname
             , sa.usename
             , sa.application_name
             , states.state
             , COALESCE(sa.count, 0) AS total
             , COALESCE(sa.max_tx_secs, 0) AS max_tx_duration_seconds
             FROM ( VALUES ('active')
                 , ('idle')
                 , ('idle in transaction')
                 , ('idle in transaction (aborted)')
                 , ('fastpath function call')
                 , ('disabled')
                 ) AS states(state)
             LEFT JOIN (
                 SELECT datname
                     , state
                     , usename
                     , COALESCE(application_name, '') AS application_name
                     , COUNT(*)
                     , COALESCE(EXTRACT (EPOCH FROM (max(now() - xact_start))), 0) AS max_tx_secs
                 FROM pg_catalog.pg_stat_activity
                 GROUP BY datname, state, usename, application_name
             ) sa ON states.state = sa.state
             WHERE sa.usename IS NOT NULL
        metrics:
          - datname:
              usage: "LABEL"
              description: "Name of the database"
          - usename:
              usage: "LABEL"
              description: "Name of the user"
          - application_name:
              usage: "LABEL"
              description: "Name of the application"
          - state:
              usage: "LABEL"
              description: "State of the backend"
          - total:
              usage: "GAUGE"
              description: "Number of backends"
          - max_tx_duration_seconds:
              usage: "GAUGE"
              description: "Maximum duration of a transaction in seconds"

      backends_waiting:
        query: |
         SELECT count(*) AS total
         FROM pg_catalog.pg_locks blocked_locks
         JOIN pg_catalog.pg_locks blocking_locks
           ON blocking_locks.locktype = blocked_locks.locktype
           AND blocking_locks.database IS NOT DISTINCT FROM blocked_locks.database
           AND blocking_locks.relation IS NOT DISTINCT FROM blocked_locks.relation
           AND blocking_locks.page IS NOT DISTINCT FROM blocked_locks.page
           AND blocking_locks.tuple IS NOT DISTINCT FROM blocked_locks.tuple
           AND blocking_locks.virtualxid IS NOT DISTINCT FROM blocked_locks.virtualxid
           AND blocking_locks.transactionid IS NOT DISTINCT FROM blocked_locks.transactionid
           AND blocking_locks.classid IS NOT DISTINCT FROM blocked_locks.classid
           AND blocking_locks.objid IS NOT DISTINCT FROM blocked_locks.objid
           AND blocking_locks.objsubid IS NOT DISTINCT FROM blocked_locks.objsubid
           AND blocking_locks.pid != blocked_locks.pid
         JOIN pg_catalog.pg_stat_activity blocking_activity ON blocking_activity.pid = blocking_locks.pid
         WHERE NOT blocked_locks.granted
        metrics:
          - total:
              usage: "GAUGE"
              description: "Total number of backends that are currently waiting on other queries"

      pg_database:
        query: |
          SELECT datname
            , pg_catalog.pg_database_size(datname) AS size_bytes
            , pg_catalog.age(datfrozenxid) AS xid_age
            , pg_catalog.mxid_age(datminmxid) AS mxid_age
          FROM pg_catalog.pg_database
          WHERE datallowconn
        metrics:
          - datname:
              usage: "LABEL"
              description: "Name of the database"
          - size_bytes:
              usage: "GAUGE"
              description: "Disk space used by the database"
          - xid_age:
              usage: "GAUGE"
              description: "Number of transactions from the frozen XID to the current one"
          - mxid_age:
              usage: "GAUGE"
              description: "Number of multiple transactions (Multixact) from the frozen XID to the current one"

      pg_postmaster:
        query: |
          SELECT EXTRACT(EPOCH FROM pg_postmaster_start_time) AS start_time
          FROM pg_catalog.pg_postmaster_start_time()
        metrics:
          - start_time:
              usage: "GAUGE"
              description: "Time at which postgres started (based on epoch)"

      pg_replication:
        query: "SELECT CASE WHEN (
                  NOT pg_catalog.pg_is_in_recovery()
                  OR pg_catalog.pg_last_wal_receive_lsn() = pg_catalog.pg_last_wal_replay_lsn())
                THEN 0
                ELSE GREATEST (0,
                  EXTRACT(EPOCH FROM (now() - pg_catalog.pg_last_xact_replay_timestamp())))
                END AS lag,
                pg_catalog.pg_is_in_recovery() AS in_recovery,
                EXISTS (TABLE pg_stat_wal_receiver) AS is_wal_receiver_up,
                (SELECT count(*) FROM pg_catalog.pg_stat_replication) AS streaming_replicas"
        metrics:
          - lag:
              usage: "GAUGE"
              description: "Replication lag behind primary in seconds"
          - in_recovery:
              usage: "GAUGE"
              description: "Whether the instance is in recovery"
          - is_wal_receiver_up:
              usage: "GAUGE"
              description: "Whether the instance wal_receiver is up"
          - streaming_replicas:
              usage: "GAUGE"
              description: "Number of streaming replicas connected to the instance"

      pg_replication_slots:
        query: |
          SELECT slot_name,
            slot_type,
            database,
            active,
            (CASE pg_catalog.pg_is_in_recovery()
              WHEN TRUE THEN pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_last_wal_receive_lsn(), restart_lsn)
              ELSE pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), restart_lsn)
            END) as pg_wal_lsn_diff
          FROM pg_catalog.pg_replication_slots
          WHERE NOT temporary
        metrics:
          - slot_name:
              usage: "LABEL"
              description: "Name of the replication slot"
          - slot_type:
              usage: "LABEL"
              description: "Type of the replication slot"
          - database:
              usage: "LABEL"
              description: "Name of the database"
          - active:
              usage: "GAUGE"
              description: "Flag indicating whether the slot is active"
          - pg_wal_lsn_diff:
              usage: "GAUGE"
              description: "Replication lag in bytes"

      pg_stat_archiver:
        query: |
          SELECT archived_count
            , failed_count
            , COALESCE(EXTRACT(EPOCH FROM (now() - last_archived_time)), -1) AS seconds_since_last_archival
            , COALESCE(EXTRACT(EPOCH FROM (now() - last_failed_time)), -1) AS seconds_since_last_failure
            , COALESCE(EXTRACT(EPOCH FROM last_archived_time), -1) AS last_archived_time
            , COALESCE(EXTRACT(EPOCH FROM last_failed_time), -1) AS last_failed_time
            , COALESCE(CAST(CAST('x'||pg_catalog.right(pg_catalog.split_part(last_archived_wal, '.', 1), 16) AS pg_catalog.bit(64)) AS pg_catalog.int8), -1) AS last_archived_wal_start_lsn
            , COALESCE(CAST(CAST('x'||pg_catalog.right(pg_catalog.split_part(last_failed_wal, '.', 1), 16) AS pg_catalog.bit(64)) AS pg_catalog.int8), -1) AS last_failed_wal_start_lsn
            , EXTRACT(EPOCH FROM stats_reset) AS stats_reset_time
          FROM pg_catalog.pg_stat_archiver
        predicate_query: |
          SELECT NOT pg_catalog.pg_is_in_recovery()
            OR pg_catalog.current_setting('archive_mode') = 'always'
        metrics:
          - archived_count:
              usage: "COUNTER"
              description: "Number of WAL files that have been successfully archived"
          - failed_count:
              usage: "COUNTER"
              description: "Number of failed attempts for archiving WAL files"
          - seconds_since_last_archival:
              usage: "GAUGE"
              description: "Seconds since the last successful archival operation"
          - seconds_since_last_failure:
              usage: "GAUGE"
              description: "Seconds since the last failed archival operation"
          - last_archived_time:
              usage: "GAUGE"
              description: "Epoch of the last time WAL archiving succeeded"
          - last_failed_time:
              usage: "GAUGE"
              description: "Epoch of the last time WAL archiving failed"
          - last_archived_wal_start_lsn:
              usage: "GAUGE"
              description: "Archived WAL start LSN"
          - last_failed_wal_start_lsn:
              usage: "GAUGE"
              description: "Last failed WAL LSN"
          - stats_reset_time:
              usage: "GAUGE"
              description: "Time at which these statistics were last reset"

      pg_stat_bgwriter:
        runonserver: "<17.0.0"
        query: |
          SELECT checkpoints_timed
            , checkpoints_req
            , checkpoint_write_time
            , checkpoint_sync_time
            , buffers_checkpoint
            , buffers_clean
            , maxwritten_clean
            , buffers_backend
            , buffers_backend_fsync
            , buffers_alloc
          FROM pg_catalog.pg_stat_bgwriter
        metrics:
          - checkpoints_timed:
              usage: "COUNTER"
              description: "Number of scheduled checkpoints that have been performed"
          - checkpoints_req:
              usage: "COUNTER"
              description: "Number of requested checkpoints that have been performed"
          - checkpoint_write_time:
              usage: "COUNTER"
              description: "Total amount of time that has been spent in the portion of checkpoint processing where files are written to disk, in milliseconds"
          - checkpoint_sync_time:
              usage: "COUNTER"
              description: "Total amount of time that has been spent in the portion of checkpoint processing where files are synchronized to disk, in milliseconds"
          - buffers_checkpoint:
              usage: "COUNTER"
              description: "Number of buffers written during checkpoints"
          - buffers_clean:
              usage: "COUNTER"
              description: "Number of buffers written by the background writer"
          - maxwritten_clean:
              usage: "COUNTER"
              description: "Number of times the background writer stopped a cleaning scan because it had written too many buffers"
          - buffers_backend:
              usage: "COUNTER"
              description: "Number of buffers written directly by a backend"
          - buffers_backend_fsync:
              usage: "COUNTER"
              description: "Number of times a backend had to execute its own fsync call (normally the background writer handles those even when the backend does its own write)"
          - buffers_alloc:
              usage: "COUNTER"
              description: "Number of buffers allocated"

      pg_stat_bgwriter_17:
        runonserver: ">=17.0.0"
        name: pg_stat_bgwriter
        query: |
          SELECT buffers_clean
            , maxwritten_clean
            , buffers_alloc
            , EXTRACT(EPOCH FROM stats_reset) AS stats_reset_time
          FROM pg_catalog.pg_stat_bgwriter
        metrics:
          - buffers_clean:
              usage: "COUNTER"
              description: "Number of buffers written by the background writer"
          - maxwritten_clean:
              usage: "COUNTER"
              description: "Number of times the background writer stopped a cleaning scan because it had written too many buffers"
          - buffers_alloc:
              usage: "COUNTER"
              description: "Number of buffers allocated"
          - stats_reset_time:
              usage: "GAUGE"
              description: "Time at which these statistics were last reset"

      pg_stat_checkpointer:
        runonserver: ">=17.0.0"
        query: |
          SELECT num_timed AS checkpoints_timed
            , num_requested AS checkpoints_req
            , restartpoints_timed
            , restartpoints_req
            , restartpoints_done
            , write_time
            , sync_time
            , buffers_written
            , EXTRACT(EPOCH FROM stats_reset) AS stats_reset_time
          FROM pg_catalog.pg_stat_checkpointer
        metrics:
          - checkpoints_timed:
              usage: "COUNTER"
              description: "Number of scheduled checkpoints that have been performed"
          - checkpoints_req:
              usage: "COUNTER"
              description: "Number of requested checkpoints that have been performed"
          - restartpoints_timed:
              usage: "COUNTER"
              description: "Number of scheduled restartpoints due to timeout or after a failed attempt to perform it"
          - restartpoints_req:
              usage: "COUNTER"
              description: "Number of requested restartpoints that have been performed"
          - restartpoints_done:
              usage: "COUNTER"
              description: "Number of restartpoints that have been performed"
          - write_time:
              usage: "COUNTER"
              description: "Total amount of time that has been spent in the portion of processing checkpoints and restartpoints where files are written to disk, in milliseconds"
          - sync_time:
              usage: "COUNTER"
              description: "Total amount of time that has been spent in the portion of processing checkpoints and restartpoints where files are synchronized to disk, in milliseconds"
          - buffers_written:
              usage: "COUNTER"
              description: "Number of buffers written during checkpoints and restartpoints"
          - stats_reset_time:
              usage: "GAUGE"
              description: "Time at which these statistics were last reset"

      pg_stat_database:
        query: |
          SELECT datname
            , xact_commit
            , xact_rollback
            , blks_read
            , blks_hit
            , tup_returned
            , tup_fetched
            , tup_inserted
            , tup_updated
            , tup_deleted
            , conflicts
            , temp_files
            , temp_bytes
            , deadlocks
            , blk_read_time
            , blk_write_time
          FROM pg_catalog.pg_stat_database
        metrics:
          - datname:
              usage: "LABEL"
              description: "Name of this database"
          - xact_commit:
              usage: "COUNTER"
              description: "Number of transactions in this database that have been committed"
          - xact_rollback:
              usage: "COUNTER"
              description: "Number of transactions in this database that have been rolled back"
          - blks_read:
              usage: "COUNTER"
              description: "Number of disk blocks read in this database"
          - blks_hit:
              usage: "COUNTER"
              description: "Number of times disk blocks were found already in the buffer cache, so that a read was not necessary (this only includes hits in the PostgreSQL buffer cache, not the operating system's file system cache)"
          - tup_returned:
              usage: "COUNTER"
              description: "Number of rows returned by queries in this database"
          - tup_fetched:
              usage: "COUNTER"
              description: "Number of rows fetched by queries in this database"
          - tup_inserted:
              usage: "COUNTER"
              description: "Number of rows inserted by queries in this database"
          - tup_updated:
              usage: "COUNTER"
              description: "Number of rows updated by queries in this database"
          - tup_deleted:
              usage: "COUNTER"
              description: "Number of rows deleted by queries in this database"
          - conflicts:
              usage: "COUNTER"
              description: "Number of queries canceled due to conflicts with recovery in this database"
          - temp_files:
              usage: "COUNTER"
              description: "Number of temporary files created by queries in this database"
          - temp_bytes:
              usage: "COUNTER"
              description: "Total amount of data written to temporary files by queries in this database"
          - deadlocks:
              usage: "COUNTER"
              description: "Number of deadlocks detected in this database"
          - blk_read_time:
              usage: "COUNTER"
              description: "Time spent reading data file blocks by backends in this database, in milliseconds"
          - blk_write_time:
              usage: "COUNTER"
              description: "Time spent writing data file blocks by backends in this database, in milliseconds"

      pg_stat_replication:
        primary: true
        query: |
         SELECT usename
           , COALESCE(application_name, '') AS application_name
           , COALESCE(client_addr::text, '') AS client_addr
           , COALESCE(client_port::text, '') AS client_port
           , EXTRACT(EPOCH FROM backend_start) AS backend_start
           , COALESCE(pg_catalog.age(backend_xmin), 0) AS backend_xmin_age
           , pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), sent_lsn) AS sent_diff_bytes
           , pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), write_lsn) AS write_diff_bytes
           , pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), flush_lsn) AS flush_diff_bytes
           , COALESCE(pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), replay_lsn),0) AS replay_diff_bytes
           , COALESCE((EXTRACT(EPOCH FROM write_lag)),0)::float AS write_lag_seconds
           , COALESCE((EXTRACT(EPOCH FROM flush_lag)),0)::float AS flush_lag_seconds
           , COALESCE((EXTRACT(EPOCH FROM replay_lag)),0)::float AS replay_lag_seconds
         FROM pg_catalog.pg_stat_replication
        metrics:
          - usename:
              usage: "LABEL"
              description: "Name of the replication user"
          - application_name:
              usage: "LABEL"
              description: "Name of the application"
          - client_addr:
              usage: "LABEL"
              description: "Client IP address"
          - client_port:
              usage: "LABEL"
              description: "Client TCP port"
          - backend_start:
              usage: "COUNTER"
              description: "Time when this process was started"
          - backend_xmin_age:
              usage: "COUNTER"
              description: "The age of this standby's xmin horizon"
          - sent_diff_bytes:
              usage: "GAUGE"
              description: "Difference in bytes from the last write-ahead log location sent on this connection"
          - write_diff_bytes:
              usage: "GAUGE"
              description: "Difference in bytes from the last write-ahead log location written to disk by this standby server"
          - flush_diff_bytes:
              usage: "GAUGE"
              description: "Difference in bytes from the last write-ahead log location flushed to disk by this standby server"
          - replay_diff_bytes:
              usage: "GAUGE"
              description: "Difference in bytes from the last write-ahead log location replayed into the database on this standby server"
          - write_lag_seconds:
              usage: "GAUGE"
              description: "Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written it"
          - flush_lag_seconds:
              usage: "GAUGE"
              description: "Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written and flushed it"
          - replay_lag_seconds:
              usage: "GAUGE"
              description: "Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written, flushed and applied it"

      pg_settings:
        query: |
          SELECT name,
          CASE setting WHEN 'on' THEN '1' WHEN 'off' THEN '0' ELSE setting END AS setting
          FROM pg_catalog.pg_settings
          WHERE vartype IN ('integer', 'real', 'bool')
          ORDER BY 1
        metrics:
          - name:
              usage: "LABEL"
              description: "Name of the setting"
          - setting:
              usage: "GAUGE"
              description: "Setting value"

      pg_extensions:
        query: |
          SELECT
           current_database() as datname,
           name as extname,
           default_version,
           installed_version,
           CASE
             WHEN default_version = installed_version THEN 0
             ELSE 1
          END AS update_available
          FROM pg_catalog.pg_available_extensions
          WHERE installed_version IS NOT NULL
        metrics:
          - datname:
              usage: "LABEL"
              description: "Name of the database"
          - extname:
              usage: "LABEL"
              description: "Extension name"
          - default_version:
              usage: "LABEL"
              description: "Default version"
          - installed_version:
              usage: "LABEL"
              description: "Installed version"
          - update_available:
              usage: "GAUGE"
              description: "An update is available"
        target_databases:
          - '*'
  kind: ConfigMap
  metadata:
    annotations:
      cnpg.io/operatorVersion: 1.28.1
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"queries":"backends:\n  query: |\n   SELECT sa.datname\n       , sa.usename\n       , sa.application_name\n       , states.state\n       , COALESCE(sa.count, 0) AS total\n       , COALESCE(sa.max_tx_secs, 0) AS max_tx_duration_seconds\n       FROM ( VALUES ('active')\n           , ('idle')\n           , ('idle in transaction')\n           , ('idle in transaction (aborted)')\n           , ('fastpath function call')\n           , ('disabled')\n           ) AS states(state)\n       LEFT JOIN (\n           SELECT datname\n               , state\n               , usename\n               , COALESCE(application_name, '') AS application_name\n               , COUNT(*)\n               , COALESCE(EXTRACT (EPOCH FROM (max(now() - xact_start))), 0) AS max_tx_secs\n           FROM pg_catalog.pg_stat_activity\n           GROUP BY datname, state, usename, application_name\n       ) sa ON states.state = sa.state\n       WHERE sa.usename IS NOT NULL\n  metrics:\n    - datname:\n        usage: \"LABEL\"\n        description: \"Name of the database\"\n    - usename:\n        usage: \"LABEL\"\n        description: \"Name of the user\"\n    - application_name:\n        usage: \"LABEL\"\n        description: \"Name of the application\"\n    - state:\n        usage: \"LABEL\"\n        description: \"State of the backend\"\n    - total:\n        usage: \"GAUGE\"\n        description: \"Number of backends\"\n    - max_tx_duration_seconds:\n        usage: \"GAUGE\"\n        description: \"Maximum duration of a transaction in seconds\"\n\nbackends_waiting:\n  query: |\n   SELECT count(*) AS total\n   FROM pg_catalog.pg_locks blocked_locks\n   JOIN pg_catalog.pg_locks blocking_locks\n     ON blocking_locks.locktype = blocked_locks.locktype\n     AND blocking_locks.database IS NOT DISTINCT FROM blocked_locks.database\n     AND blocking_locks.relation IS NOT DISTINCT FROM blocked_locks.relation\n     AND blocking_locks.page IS NOT DISTINCT FROM blocked_locks.page\n     AND blocking_locks.tuple IS NOT DISTINCT FROM blocked_locks.tuple\n     AND blocking_locks.virtualxid IS NOT DISTINCT FROM blocked_locks.virtualxid\n     AND blocking_locks.transactionid IS NOT DISTINCT FROM blocked_locks.transactionid\n     AND blocking_locks.classid IS NOT DISTINCT FROM blocked_locks.classid\n     AND blocking_locks.objid IS NOT DISTINCT FROM blocked_locks.objid\n     AND blocking_locks.objsubid IS NOT DISTINCT FROM blocked_locks.objsubid\n     AND blocking_locks.pid != blocked_locks.pid\n   JOIN pg_catalog.pg_stat_activity blocking_activity ON blocking_activity.pid = blocking_locks.pid\n   WHERE NOT blocked_locks.granted\n  metrics:\n    - total:\n        usage: \"GAUGE\"\n        description: \"Total number of backends that are currently waiting on other queries\"\n\npg_database:\n  query: |\n    SELECT datname\n      , pg_catalog.pg_database_size(datname) AS size_bytes\n      , pg_catalog.age(datfrozenxid) AS xid_age\n      , pg_catalog.mxid_age(datminmxid) AS mxid_age\n    FROM pg_catalog.pg_database\n    WHERE datallowconn\n  metrics:\n    - datname:\n        usage: \"LABEL\"\n        description: \"Name of the database\"\n    - size_bytes:\n        usage: \"GAUGE\"\n        description: \"Disk space used by the database\"\n    - xid_age:\n        usage: \"GAUGE\"\n        description: \"Number of transactions from the frozen XID to the current one\"\n    - mxid_age:\n        usage: \"GAUGE\"\n        description: \"Number of multiple transactions (Multixact) from the frozen XID to the current one\"\n\npg_postmaster:\n  query: |\n    SELECT EXTRACT(EPOCH FROM pg_postmaster_start_time) AS start_time\n    FROM pg_catalog.pg_postmaster_start_time()\n  metrics:\n    - start_time:\n        usage: \"GAUGE\"\n        description: \"Time at which postgres started (based on epoch)\"\n\npg_replication:\n  query: \"SELECT CASE WHEN (\n            NOT pg_catalog.pg_is_in_recovery()\n            OR pg_catalog.pg_last_wal_receive_lsn() = pg_catalog.pg_last_wal_replay_lsn())\n          THEN 0\n          ELSE GREATEST (0,\n            EXTRACT(EPOCH FROM (now() - pg_catalog.pg_last_xact_replay_timestamp())))\n          END AS lag,\n          pg_catalog.pg_is_in_recovery() AS in_recovery,\n          EXISTS (TABLE pg_stat_wal_receiver) AS is_wal_receiver_up,\n          (SELECT count(*) FROM pg_catalog.pg_stat_replication) AS streaming_replicas\"\n  metrics:\n    - lag:\n        usage: \"GAUGE\"\n        description: \"Replication lag behind primary in seconds\"\n    - in_recovery:\n        usage: \"GAUGE\"\n        description: \"Whether the instance is in recovery\"\n    - is_wal_receiver_up:\n        usage: \"GAUGE\"\n        description: \"Whether the instance wal_receiver is up\"\n    - streaming_replicas:\n        usage: \"GAUGE\"\n        description: \"Number of streaming replicas connected to the instance\"\n\npg_replication_slots:\n  query: |\n    SELECT slot_name,\n      slot_type,\n      database,\n      active,\n      (CASE pg_catalog.pg_is_in_recovery()\n        WHEN TRUE THEN pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_last_wal_receive_lsn(), restart_lsn)\n        ELSE pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), restart_lsn)\n      END) as pg_wal_lsn_diff\n    FROM pg_catalog.pg_replication_slots\n    WHERE NOT temporary\n  metrics:\n    - slot_name:\n        usage: \"LABEL\"\n        description: \"Name of the replication slot\"\n    - slot_type:\n        usage: \"LABEL\"\n        description: \"Type of the replication slot\"\n    - database:\n        usage: \"LABEL\"\n        description: \"Name of the database\"\n    - active:\n        usage: \"GAUGE\"\n        description: \"Flag indicating whether the slot is active\"\n    - pg_wal_lsn_diff:\n        usage: \"GAUGE\"\n        description: \"Replication lag in bytes\"\n\npg_stat_archiver:\n  query: |\n    SELECT archived_count\n      , failed_count\n      , COALESCE(EXTRACT(EPOCH FROM (now() - last_archived_time)), -1) AS seconds_since_last_archival\n      , COALESCE(EXTRACT(EPOCH FROM (now() - last_failed_time)), -1) AS seconds_since_last_failure\n      , COALESCE(EXTRACT(EPOCH FROM last_archived_time), -1) AS last_archived_time\n      , COALESCE(EXTRACT(EPOCH FROM last_failed_time), -1) AS last_failed_time\n      , COALESCE(CAST(CAST('x'||pg_catalog.right(pg_catalog.split_part(last_archived_wal, '.', 1), 16) AS pg_catalog.bit(64)) AS pg_catalog.int8), -1) AS last_archived_wal_start_lsn\n      , COALESCE(CAST(CAST('x'||pg_catalog.right(pg_catalog.split_part(last_failed_wal, '.', 1), 16) AS pg_catalog.bit(64)) AS pg_catalog.int8), -1) AS last_failed_wal_start_lsn\n      , EXTRACT(EPOCH FROM stats_reset) AS stats_reset_time\n    FROM pg_catalog.pg_stat_archiver\n  predicate_query: |\n    SELECT NOT pg_catalog.pg_is_in_recovery()\n      OR pg_catalog.current_setting('archive_mode') = 'always'\n  metrics:\n    - archived_count:\n        usage: \"COUNTER\"\n        description: \"Number of WAL files that have been successfully archived\"\n    - failed_count:\n        usage: \"COUNTER\"\n        description: \"Number of failed attempts for archiving WAL files\"\n    - seconds_since_last_archival:\n        usage: \"GAUGE\"\n        description: \"Seconds since the last successful archival operation\"\n    - seconds_since_last_failure:\n        usage: \"GAUGE\"\n        description: \"Seconds since the last failed archival operation\"\n    - last_archived_time:\n        usage: \"GAUGE\"\n        description: \"Epoch of the last time WAL archiving succeeded\"\n    - last_failed_time:\n        usage: \"GAUGE\"\n        description: \"Epoch of the last time WAL archiving failed\"\n    - last_archived_wal_start_lsn:\n        usage: \"GAUGE\"\n        description: \"Archived WAL start LSN\"\n    - last_failed_wal_start_lsn:\n        usage: \"GAUGE\"\n        description: \"Last failed WAL LSN\"\n    - stats_reset_time:\n        usage: \"GAUGE\"\n        description: \"Time at which these statistics were last reset\"\n\npg_stat_bgwriter:\n  runonserver: \"\u003c17.0.0\"\n  query: |\n    SELECT checkpoints_timed\n      , checkpoints_req\n      , checkpoint_write_time\n      , checkpoint_sync_time\n      , buffers_checkpoint\n      , buffers_clean\n      , maxwritten_clean\n      , buffers_backend\n      , buffers_backend_fsync\n      , buffers_alloc\n    FROM pg_catalog.pg_stat_bgwriter\n  metrics:\n    - checkpoints_timed:\n        usage: \"COUNTER\"\n        description: \"Number of scheduled checkpoints that have been performed\"\n    - checkpoints_req:\n        usage: \"COUNTER\"\n        description: \"Number of requested checkpoints that have been performed\"\n    - checkpoint_write_time:\n        usage: \"COUNTER\"\n        description: \"Total amount of time that has been spent in the portion of checkpoint processing where files are written to disk, in milliseconds\"\n    - checkpoint_sync_time:\n        usage: \"COUNTER\"\n        description: \"Total amount of time that has been spent in the portion of checkpoint processing where files are synchronized to disk, in milliseconds\"\n    - buffers_checkpoint:\n        usage: \"COUNTER\"\n        description: \"Number of buffers written during checkpoints\"\n    - buffers_clean:\n        usage: \"COUNTER\"\n        description: \"Number of buffers written by the background writer\"\n    - maxwritten_clean:\n        usage: \"COUNTER\"\n        description: \"Number of times the background writer stopped a cleaning scan because it had written too many buffers\"\n    - buffers_backend:\n        usage: \"COUNTER\"\n        description: \"Number of buffers written directly by a backend\"\n    - buffers_backend_fsync:\n        usage: \"COUNTER\"\n        description: \"Number of times a backend had to execute its own fsync call (normally the background writer handles those even when the backend does its own write)\"\n    - buffers_alloc:\n        usage: \"COUNTER\"\n        description: \"Number of buffers allocated\"\n\npg_stat_bgwriter_17:\n  runonserver: \"\u003e=17.0.0\"\n  name: pg_stat_bgwriter\n  query: |\n    SELECT buffers_clean\n      , maxwritten_clean\n      , buffers_alloc\n      , EXTRACT(EPOCH FROM stats_reset) AS stats_reset_time\n    FROM pg_catalog.pg_stat_bgwriter\n  metrics:\n    - buffers_clean:\n        usage: \"COUNTER\"\n        description: \"Number of buffers written by the background writer\"\n    - maxwritten_clean:\n        usage: \"COUNTER\"\n        description: \"Number of times the background writer stopped a cleaning scan because it had written too many buffers\"\n    - buffers_alloc:\n        usage: \"COUNTER\"\n        description: \"Number of buffers allocated\"\n    - stats_reset_time:\n        usage: \"GAUGE\"\n        description: \"Time at which these statistics were last reset\"\n\npg_stat_checkpointer:\n  runonserver: \"\u003e=17.0.0\"\n  query: |\n    SELECT num_timed AS checkpoints_timed\n      , num_requested AS checkpoints_req\n      , restartpoints_timed\n      , restartpoints_req\n      , restartpoints_done\n      , write_time\n      , sync_time\n      , buffers_written\n      , EXTRACT(EPOCH FROM stats_reset) AS stats_reset_time\n    FROM pg_catalog.pg_stat_checkpointer\n  metrics:\n    - checkpoints_timed:\n        usage: \"COUNTER\"\n        description: \"Number of scheduled checkpoints that have been performed\"\n    - checkpoints_req:\n        usage: \"COUNTER\"\n        description: \"Number of requested checkpoints that have been performed\"\n    - restartpoints_timed:\n        usage: \"COUNTER\"\n        description: \"Number of scheduled restartpoints due to timeout or after a failed attempt to perform it\"\n    - restartpoints_req:\n        usage: \"COUNTER\"\n        description: \"Number of requested restartpoints that have been performed\"\n    - restartpoints_done:\n        usage: \"COUNTER\"\n        description: \"Number of restartpoints that have been performed\"\n    - write_time:\n        usage: \"COUNTER\"\n        description: \"Total amount of time that has been spent in the portion of processing checkpoints and restartpoints where files are written to disk, in milliseconds\"\n    - sync_time:\n        usage: \"COUNTER\"\n        description: \"Total amount of time that has been spent in the portion of processing checkpoints and restartpoints where files are synchronized to disk, in milliseconds\"\n    - buffers_written:\n        usage: \"COUNTER\"\n        description: \"Number of buffers written during checkpoints and restartpoints\"\n    - stats_reset_time:\n        usage: \"GAUGE\"\n        description: \"Time at which these statistics were last reset\"\n\npg_stat_database:\n  query: |\n    SELECT datname\n      , xact_commit\n      , xact_rollback\n      , blks_read\n      , blks_hit\n      , tup_returned\n      , tup_fetched\n      , tup_inserted\n      , tup_updated\n      , tup_deleted\n      , conflicts\n      , temp_files\n      , temp_bytes\n      , deadlocks\n      , blk_read_time\n      , blk_write_time\n    FROM pg_catalog.pg_stat_database\n  metrics:\n    - datname:\n        usage: \"LABEL\"\n        description: \"Name of this database\"\n    - xact_commit:\n        usage: \"COUNTER\"\n        description: \"Number of transactions in this database that have been committed\"\n    - xact_rollback:\n        usage: \"COUNTER\"\n        description: \"Number of transactions in this database that have been rolled back\"\n    - blks_read:\n        usage: \"COUNTER\"\n        description: \"Number of disk blocks read in this database\"\n    - blks_hit:\n        usage: \"COUNTER\"\n        description: \"Number of times disk blocks were found already in the buffer cache, so that a read was not necessary (this only includes hits in the PostgreSQL buffer cache, not the operating system's file system cache)\"\n    - tup_returned:\n        usage: \"COUNTER\"\n        description: \"Number of rows returned by queries in this database\"\n    - tup_fetched:\n        usage: \"COUNTER\"\n        description: \"Number of rows fetched by queries in this database\"\n    - tup_inserted:\n        usage: \"COUNTER\"\n        description: \"Number of rows inserted by queries in this database\"\n    - tup_updated:\n        usage: \"COUNTER\"\n        description: \"Number of rows updated by queries in this database\"\n    - tup_deleted:\n        usage: \"COUNTER\"\n        description: \"Number of rows deleted by queries in this database\"\n    - conflicts:\n        usage: \"COUNTER\"\n        description: \"Number of queries canceled due to conflicts with recovery in this database\"\n    - temp_files:\n        usage: \"COUNTER\"\n        description: \"Number of temporary files created by queries in this database\"\n    - temp_bytes:\n        usage: \"COUNTER\"\n        description: \"Total amount of data written to temporary files by queries in this database\"\n    - deadlocks:\n        usage: \"COUNTER\"\n        description: \"Number of deadlocks detected in this database\"\n    - blk_read_time:\n        usage: \"COUNTER\"\n        description: \"Time spent reading data file blocks by backends in this database, in milliseconds\"\n    - blk_write_time:\n        usage: \"COUNTER\"\n        description: \"Time spent writing data file blocks by backends in this database, in milliseconds\"\n\npg_stat_replication:\n  primary: true\n  query: |\n   SELECT usename\n     , COALESCE(application_name, '') AS application_name\n     , COALESCE(client_addr::text, '') AS client_addr\n     , COALESCE(client_port::text, '') AS client_port\n     , EXTRACT(EPOCH FROM backend_start) AS backend_start\n     , COALESCE(pg_catalog.age(backend_xmin), 0) AS backend_xmin_age\n     , pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), sent_lsn) AS sent_diff_bytes\n     , pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), write_lsn) AS write_diff_bytes\n     , pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), flush_lsn) AS flush_diff_bytes\n     , COALESCE(pg_catalog.pg_wal_lsn_diff(pg_catalog.pg_current_wal_lsn(), replay_lsn),0) AS replay_diff_bytes\n     , COALESCE((EXTRACT(EPOCH FROM write_lag)),0)::float AS write_lag_seconds\n     , COALESCE((EXTRACT(EPOCH FROM flush_lag)),0)::float AS flush_lag_seconds\n     , COALESCE((EXTRACT(EPOCH FROM replay_lag)),0)::float AS replay_lag_seconds\n   FROM pg_catalog.pg_stat_replication\n  metrics:\n    - usename:\n        usage: \"LABEL\"\n        description: \"Name of the replication user\"\n    - application_name:\n        usage: \"LABEL\"\n        description: \"Name of the application\"\n    - client_addr:\n        usage: \"LABEL\"\n        description: \"Client IP address\"\n    - client_port:\n        usage: \"LABEL\"\n        description: \"Client TCP port\"\n    - backend_start:\n        usage: \"COUNTER\"\n        description: \"Time when this process was started\"\n    - backend_xmin_age:\n        usage: \"COUNTER\"\n        description: \"The age of this standby's xmin horizon\"\n    - sent_diff_bytes:\n        usage: \"GAUGE\"\n        description: \"Difference in bytes from the last write-ahead log location sent on this connection\"\n    - write_diff_bytes:\n        usage: \"GAUGE\"\n        description: \"Difference in bytes from the last write-ahead log location written to disk by this standby server\"\n    - flush_diff_bytes:\n        usage: \"GAUGE\"\n        description: \"Difference in bytes from the last write-ahead log location flushed to disk by this standby server\"\n    - replay_diff_bytes:\n        usage: \"GAUGE\"\n        description: \"Difference in bytes from the last write-ahead log location replayed into the database on this standby server\"\n    - write_lag_seconds:\n        usage: \"GAUGE\"\n        description: \"Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written it\"\n    - flush_lag_seconds:\n        usage: \"GAUGE\"\n        description: \"Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written and flushed it\"\n    - replay_lag_seconds:\n        usage: \"GAUGE\"\n        description: \"Time elapsed between flushing recent WAL locally and receiving notification that this standby server has written, flushed and applied it\"\n\npg_settings:\n  query: |\n    SELECT name,\n    CASE setting WHEN 'on' THEN '1' WHEN 'off' THEN '0' ELSE setting END AS setting\n    FROM pg_catalog.pg_settings\n    WHERE vartype IN ('integer', 'real', 'bool')\n    ORDER BY 1\n  metrics:\n    - name:\n        usage: \"LABEL\"\n        description: \"Name of the setting\"\n    - setting:\n        usage: \"GAUGE\"\n        description: \"Setting value\"\n\npg_extensions:\n  query: |\n    SELECT\n     current_database() as datname,\n     name as extname,\n     default_version,\n     installed_version,\n     CASE\n       WHEN default_version = installed_version THEN 0\n       ELSE 1\n    END AS update_available\n    FROM pg_catalog.pg_available_extensions\n    WHERE installed_version IS NOT NULL\n  metrics:\n    - datname:\n        usage: \"LABEL\"\n        description: \"Name of the database\"\n    - extname:\n        usage: \"LABEL\"\n        description: \"Extension name\"\n    - default_version:\n        usage: \"LABEL\"\n        description: \"Default version\"\n    - installed_version:\n        usage: \"LABEL\"\n        description: \"Installed version\"\n    - update_available:\n        usage: \"GAUGE\"\n        description: \"An update is available\"\n  target_databases:\n    - '*'\n"},"kind":"ConfigMap","metadata":{"annotations":{"cnpg.io/operatorVersion":"1.28.1"},"creationTimestamp":"2026-03-11T09:12:49Z","labels":{"app.kubernetes.io/managed-by":"cloudnative-pg","cnpg.io/reload":"true"},"name":"cnpg-default-monitoring","namespace":"default","resourceVersion":"1277","uid":"84a6336f-8ce5-4be5-88ee-54844c5a3923"}}
